<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eatiseasy — muy pronto</title>
<link rel="icon" type="image/png" href="eie-st.png">
<link rel="apple-touch-icon" href="eie-st.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FAFBF6; --ink:#182D1E; --muted:#5c6b58; --surface:#FFFFFF; --surface-2:#F1F7ED;
  --line:rgba(24,45,30,.1); --line-strong:rgba(24,45,30,.18);
  --watermelon:#FF4D6D; --rind:#1E8449; --seed:#182D1E;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--cream); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.5; overflow-x:hidden;
  min-height:100dvh; display:flex; flex-direction:column;
}
.display{font-family:'Space Grotesk',sans-serif;}

.nav{display:flex; align-items:center; justify-content:space-between; padding:26px 24px;}
.nav-brand{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; letter-spacing:-.4px;}
.nav-brand .dot{color:var(--watermelon);}
.social-icons{display:flex; gap:12px;}
.social-icons a{width:34px; height:34px; border-radius:50%; background:var(--surface); border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; text-decoration:none; transition:transform .15s ease, background .15s ease;}
.social-icons a:hover{transform:translateY(-2px); background:var(--surface-2);}
.social-icons svg{width:16px; height:16px;}

.hero{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 24px 60px 24px; position:relative;}
.blob{position:absolute; border-radius:50%; filter:blur(80px); opacity:.35; z-index:0;}
.blob-1{width:320px; height:320px; background:var(--watermelon); top:5%; right:8%;}
.blob-2{width:260px; height:260px; background:var(--rind); bottom:0; left:0;}

.badge-row{position:relative; z-index:1; display:inline-flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line-strong); border-radius:30px; padding:8px 16px 8px 8px; margin-bottom:28px;}
.badge-icon{width:26px; height:26px; border-radius:50%; background:var(--watermelon); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px;}
.badge-row span{font-size:12.5px; font-weight:700;}

.hero h1{position:relative; z-index:1; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(34px,7vw,58px); line-height:1.05; letter-spacing:-1.6px; max-width:14ch;}
.hero h1 .accent{color:var(--watermelon);}
.hero p{position:relative; z-index:1; margin-top:18px; font-size:16.5px; color:var(--muted); max-width:38ch; line-height:1.55;}

.countdown{position:relative; z-index:1; display:flex; gap:14px; margin-top:44px; flex-wrap:wrap; justify-content:center;}
.cd-unit{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px 20px; min-width:82px;}
.cd-num{font-family:'Space Grotesk',sans-serif; font-size:clamp(28px,5vw,38px); font-weight:700; letter-spacing:-1px; line-height:1;}
.cd-label{font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-top:6px;}

.launch-date{position:relative; z-index:1; margin-top:34px; font-size:13.5px; color:var(--muted);}
.launch-date b{color:var(--ink);}

footer{padding:26px 24px 40px 24px; text-align:center; font-size:12px; color:var(--muted);}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">eatis<span class="dot">•</span>easy</div>
  <div class="social-icons">
    <a href="https://www.instagram.com/eatiseasy_app" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
    </a>
    <a href="https://www.tiktok.com/@eatiseasy" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c.4 2.2 1.8 3.7 4 4v3c-1.5 0-2.9-.4-4-1.2V15a6 6 0 1 1-6-6c.3 0 .7 0 1 .1v3.1a3 3 0 1 0 2 2.8V3h2.7z"/></svg>
    </a>
  </div>
</nav>

<div class="hero">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="badge-row"><span class="badge-icon">🍉</span><span>Estamos a punto de abrir</span></div>

  <h1 class="display">Algo delicioso está a punto de <span class="accent">llegar.</span></h1>
  <p>eatiseasy, la forma más fácil de contar calorías — haz una foto y listo. Muy pronto disponible para todos.</p>

  <div class="countdown" id="countdown">
    <div class="cd-unit"><div class="cd-num" id="cd-days">–</div><div class="cd-label">Días</div></div>
    <div class="cd-unit"><div class="cd-num" id="cd-hours">–</div><div class="cd-label">Horas</div></div>
    <div class="cd-unit"><div class="cd-num" id="cd-mins">–</div><div class="cd-label">Min</div></div>
    <div class="cd-unit"><div class="cd-num" id="cd-secs">–</div><div class="cd-label">Seg</div></div>
  </div>

  <div class="launch-date">Nos vemos el <b>3 de septiembre a las 13:30</b> 🍉</div>
</div>

<footer>
  Desarrollado por Iker Nebreda
</footer>

<script>
  // Cambia esta fecha/hora si quieres que abra en un momento distinto del día
  const LAUNCH_DATE = new Date('2026-09-03T13:30:00');

  function updateCountdown(){
    const now = new Date();
    const diff = LAUNCH_DATE - now;
    if(diff <= 0){
      document.getElementById('countdown').innerHTML = '<div class="cd-unit"><div class="cd-num">🎉</div><div class="cd-label">¡Ya está aquí!</div></div>';
      return;
    }
    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60)) % 24);
    const mins = Math.floor((diff / (1000*60)) % 60);
    const secs = Math.floor((diff / 1000) % 60);
    document.getElementById('cd-days').textContent = days;
    document.getElementById('cd-hours').textContent = String(hours).padStart(2,'0');
    document.getElementById('cd-mins').textContent = String(mins).padStart(2,'0');
    document.getElementById('cd-secs').textContent = String(secs).padStart(2,'0');
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
