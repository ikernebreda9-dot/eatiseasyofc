<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eatiseasy</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="eie-beta.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  /* Watermelon palette — piel (rind), pulpa (flesh), pepitas (seeds) */
  --void:#FAFBF6; --surface:#FFFFFF; --surface-2:#F1F7ED; --paper:#182D1E; --muted:#84937F;
  --line:rgba(24,45,30,.08); --line-strong:rgba(24,45,30,.16);
  --accent:#FF4D6D; --accent-dark:#D6293F; --accent-soft:rgba(255,77,109,.12); --accent-rgb:255,77,109;
  --warn:#C8391F;
  --protein:#1E8449; --protein-soft:rgba(30,132,73,.12); --protein-rgb:30,132,73;
  --carbs:#F0405C; --carbs-soft:rgba(240,64,92,.12);
  --fat:#2B2B2B; --fat-soft:rgba(43,43,43,.08);
  --burn:#FF8A3D;
}
/* Sandía de noche — misma paleta, de noche. Las pepitas negras pasan a un
   tono cálido claro porque el negro se hunde en un fondo oscuro. */
body.dark-mode{
  --void:#12201A; --surface:#1B2B22; --surface-2:#23362B; --paper:#F1EFE3; --muted:#8FA090;
  --line:rgba(241,239,227,.08); --line-strong:rgba(241,239,227,.16);
  --accent-dark:#FF7A93;
  --warn:#FF7A5C;
  --protein-soft:rgba(76,175,114,.18);
  --carbs-soft:rgba(240,64,92,.22);
  --fat:#D8C89A; --fat-soft:rgba(216,200,154,.16);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0; background:var(--void); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--paper); -webkit-font-smoothing:antialiased; transition:background .25s ease, color .25s ease;}
.app{max-width:480px; margin:0 auto; min-height:100vh; background:
    radial-gradient(circle at 12% 0%, rgba(var(--accent-rgb),.10), transparent 55%),
    radial-gradient(circle at 88% 26%, rgba(var(--protein-rgb),.08), transparent 55%),
    radial-gradient(circle at 20% 90%, rgba(var(--accent-rgb),.06), transparent 50%),
    var(--void);
  position:relative; padding-bottom:calc(74px + env(safe-area-inset-bottom));}
.hide{display:none !important;}
.serif{font-family:inherit;}
.mono{font-family:inherit;}

.topbar{padding:22px 20px 4px 20px; display:flex; align-items:baseline; justify-content:space-between;}
.topbar .brand{font-family:inherit; font-size:19px; font-weight:600; letter-spacing:-.2px; color:var(--paper);}
.topbar .brand .dot{color:var(--accent);}
.topbar .date{font-family:inherit; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}
.screen{padding:2px 20px 24px 20px;}

.ring-wrap{display:flex; justify-content:center; padding:22px 0 8px 0;}

.week-strip{display:flex; justify-content:space-between; padding:16px 0 4px 0; gap:4px;}
.week-cell{display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0; border-radius:14px; flex:1; cursor:pointer;}
.week-cell.is-disabled{cursor:default; opacity:.4;}
.week-letter{font-size:11px; color:var(--muted); font-weight:600;}
.week-num{font-size:13px; font-weight:700; color:var(--paper); width:26px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:50%;}
.week-cell.is-today .week-num{background:var(--paper); color:var(--void);}

.hero-card{background:var(--surface); border-radius:20px; padding:22px 22px 18px 22px; margin-top:12px; border:1px solid var(--line); box-shadow:0 2px 10px rgba(24,45,30,.06);}
.hero-top{display:flex; align-items:center; justify-content:space-between;}
.hero-number{font-size:40px; font-weight:800; letter-spacing:-1px; line-height:1;}
.hero-label{font-size:13px; color:var(--muted); margin-top:4px; font-weight:600;}
.hero-ring svg{width:104px; height:104px;}

.macro-card{flex:1; background:var(--surface); border-radius:16px; padding:14px 8px 16px 8px; border:1px solid var(--line); box-shadow:0 2px 10px rgba(24,45,30,.05); text-align:center; display:flex; flex-direction:column; align-items:center;}
.macro-card-num{font-size:17px; font-weight:800; letter-spacing:-.3px;}
.macro-card-label{font-size:10px; color:var(--muted); font-weight:600; margin:2px 0 10px 0; line-height:1.25;}
.macro-ring-wrap{width:64px; height:64px;}
.macro-ring{width:100%; height:100%;}
.hero-sub{font-size:11.5px; color:var(--muted); margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}

.macro-row{display:flex; gap:10px; margin-top:12px;}

.log-card{display:flex; align-items:center; gap:12px; background:var(--surface); border-radius:16px; padding:10px; margin-top:10px; border:1px solid var(--line); box-shadow:0 2px 8px rgba(24,45,30,.05); cursor:pointer;}
.log-thumb{width:52px; height:52px; border-radius:12px; object-fit:cover; flex-shrink:0;}
.log-thumb-fallback{display:flex; align-items:center; justify-content:center; background:var(--surface-2); font-size:20px;}
.log-info{flex:1; min-width:0;}
.log-name{font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.log-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
.ring{width:210px; height:210px; filter:drop-shadow(0 4px 16px rgba(var(--accent-rgb),.28));}
.ring-track{fill:none; stroke:var(--protein); opacity:1; stroke-width:9; stroke-opacity:.28;}
.ring-fill{fill:none; stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);}
.ring-num{font-family:inherit; font-size:42px; font-weight:600; text-anchor:middle;}
.ring-num-mini{font-family:inherit; font-size:44px; font-weight:600; text-anchor:middle;}
.ring-label{font-family:inherit; font-size:10px; text-anchor:middle; fill:var(--muted); letter-spacing:1.5px; text-transform:uppercase;}

.mini-history-strip{display:flex; gap:16px; overflow-x:auto; padding:4px 2px 12px 2px; -webkit-overflow-scrolling:touch;}
.mini-history-strip::-webkit-scrollbar{display:none;}
.mini-day{display:flex; flex-direction:column; align-items:center; gap:5px; flex-shrink:0; cursor:pointer;}
.mini-day-label{font-family:inherit; font-size:9px; font-weight:600; color:var(--muted); text-transform:uppercase;}
.mini-day .ring-mini{width:52px; height:52px;}

.section-title{font-family:inherit; font-size:10px; font-weight:700; color:var(--protein); text-transform:uppercase; letter-spacing:1.5px; margin:26px 0 10px 2px;}

.bar-block{margin-bottom:18px;}
.bar-top{display:flex; align-items:center; justify-content:space-between; font-size:13px; margin-bottom:7px;}
.bar-top .lbl{display:flex; align-items:center; gap:8px;}
.bar-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.bar-top .val{font-family:inherit; color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px;}
.bar-track{height:3px; background:var(--line-strong); border-radius:2px; overflow:hidden;}
.bar-fill{height:100%; border-radius:2px; transition:width .5s cubic-bezier(.4,0,.2,1);}

.row{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--line); font-size:14px;}
.row:last-child{border-bottom:none;}
.row .rname{display:flex; align-items:center; gap:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:70%; color:var(--paper); font-weight:500;}
.row .rval{display:flex; align-items:center; gap:10px; font-family:inherit; font-variant-numeric:tabular-nums; color:var(--paper); font-size:13px;}
.row .del{color:var(--muted); font-size:15px; line-height:1; cursor:pointer; padding:4px;}
.empty{color:var(--muted); font-size:13px; padding:18px 0; text-align:center; font-style:italic; font-family:inherit;}
.panel{background:var(--surface); border-radius:14px; padding:16px 18px; margin-top:14px; border:1px solid var(--line); box-shadow:0 1px 2px rgba(0,0,0,.2);}

.field{margin-bottom:14px;}
.field label{display:block; font-family:inherit; font-size:10px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.8px;}
.field input, .field select{width:100%; border:none; border-bottom:1.5px solid var(--line-strong); background:transparent; padding:8px 2px; font-size:15px; color:var(--paper); font-family:inherit;}
.field input::placeholder{color:var(--muted); opacity:.6;}
.field input:focus, .field select:focus{outline:none; border-color:var(--accent);}
.field select option{background:var(--surface); color:var(--paper);}
.row2{display:flex; gap:16px;}
.row2 .field{flex:1;}

.btn{font-family:inherit; font-weight:700; font-size:14px; padding:14px; border:none; border-radius:10px; cursor:pointer; background:var(--surface-2); color:var(--paper); width:100%; border:1px solid var(--line-strong); transition:transform .12s ease;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.4;}
.btn.accent{background:var(--accent); color:#FFFFFF; border-color:var(--accent);}
.btn.ghost{background:transparent; color:var(--paper); border:1.5px solid var(--line-strong);}
.btn.small{width:auto; padding:9px 16px; font-size:12.5px; border-radius:9px;}

details{margin-top:12px;}
details summary{list-style:none; cursor:pointer; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--accent); padding:4px 0;}
details summary::-webkit-details-marker{display:none;}
details summary:before{content:'+ ';}
details[open] summary:before{content:'– ';}
details .inner{padding-top:10px;}

.photo-btn{display:block; width:100%; padding:22px; text-align:center; border-radius:14px; background:var(--surface); color:var(--accent); font-family:inherit; font-weight:700; font-size:13.5px; cursor:pointer; border:1.5px dashed var(--line-strong);}
.visually-hidden-file{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}

.toast{position:fixed; bottom:calc(88px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--paper); color:var(--void); padding:10px 16px; border-radius:10px; font-size:12.5px; max-width:82%; text-align:center; z-index:60; font-weight:600;}
.toast.err{background:var(--warn); color:#fff;}

.tabbar{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; background:rgba(21,20,15,.9); backdrop-filter:blur(14px); border-top:1px solid var(--line); display:flex; justify-content:center; gap:70px; padding-bottom:env(safe-area-inset-bottom); z-index:30;}
.tabbar button{flex:none; background:none; border:none; padding:12px 22px 10px 22px; color:var(--muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;}
.tabbar button.active{color:var(--accent);}
.tabbar svg{width:21px; height:21px;}
.tabbar span{font-family:inherit; font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;}

.fab{position:fixed; right:calc((100vw - min(100vw,480px))/2 + 18px); bottom:calc(84px + env(safe-area-inset-bottom)); width:52px; height:52px; border-radius:50%; background:var(--accent); color:#FFFFFF; border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 20px rgba(var(--accent-rgb),.4); z-index:35; cursor:pointer; transition:transform .12s ease;}
.fab:active{transform:scale(.93);}
.fab svg{width:23px; height:23px; stroke:#FFFFFF !important;}

.overlay{position:fixed; inset:0; background:var(--void); z-index:100; overflow-y:auto; display:flex; justify-content:center;}
.overlay-card{max-width:480px; width:100%; padding:32px 20px calc(28px + env(safe-area-inset-bottom)) 20px;}
.overlay-card h1{font-family:inherit; font-size:26px; font-weight:600; margin:6px 0 4px 0; letter-spacing:-.3px; color:var(--paper);}
.overlay-card p.sub{color:var(--muted); font-size:13px; margin:0 0 24px 0; line-height:1.5;}
.ob-progress{height:5px; background:var(--line-strong); border-radius:4px; overflow:hidden; margin-bottom:24px;}
.ob-progress-fill{height:100%; background:var(--accent); border-radius:4px; transition:width .35s ease;}
.ob-loading-title{font-size:17px; font-weight:800; text-align:center; letter-spacing:-.2px;}

.big-number{font-family:inherit; font-size:34px; font-weight:600; letter-spacing:-.5px; color:var(--paper);}
.weight-row{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-top:4px;}
.spark{width:100%; height:auto; margin-top:20px;}
.plist .row .rval{font-weight:500;}

.avatar-header{display:flex; flex-direction:column; align-items:center; gap:10px; padding:18px 0 8px 0;}
.avatar-circle{position:relative; width:88px; height:88px; border-radius:50%; background:var(--surface-2); color:var(--accent); display:flex; align-items:center; justify-content:center; font-family:inherit; font-size:32px; font-weight:600; cursor:pointer; overflow:hidden; border:2px solid var(--accent); box-shadow:0 2px 14px rgba(0,0,0,.3);}
.avatar-circle img{width:100%; height:100%; object-fit:cover;}
.avatar-edit{position:absolute; bottom:-2px; right:-2px; width:26px; height:26px; border-radius:50%; background:var(--accent); color:#FFFFFF; font-size:12px; display:flex; align-items:center; justify-content:center; border:2px solid var(--void);}
.avatar-name{font-family:inherit; font-size:14px; font-weight:700; color:var(--paper);}

.theme-row{display:flex; justify-content:center; gap:14px; padding:16px 0 4px 0;}
.theme-dot{width:24px; height:24px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; box-shadow:0 0 0 1px var(--line-strong) inset;}
.theme-dot.selected{border-color:var(--paper);}

.switch{position:relative; display:inline-block; width:46px; height:27px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.switch-slider{position:absolute; inset:0; background:var(--line-strong); border-radius:20px; cursor:pointer; transition:background .2s ease;}
.switch-slider:before{content:''; position:absolute; width:21px; height:21px; left:3px; top:3px; background:var(--surface); border-radius:50%; transition:transform .2s ease; box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch input:checked + .switch-slider{background:var(--accent);}
.switch input:checked + .switch-slider:before{transform:translateX(19px);}

.pro-banner{display:flex; align-items:center; gap:12px; padding:16px 18px; margin-top:14px; border-radius:14px; background:linear-gradient(135deg, rgba(var(--accent-rgb),.13), rgba(var(--accent-rgb),.04)); border:1px solid rgba(var(--accent-rgb),.35);}
.pro-banner .pro-icon{width:34px; height:34px; border-radius:50%; background:var(--accent); color:#FFFFFF; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:15px;}
.pro-banner .pro-title{font-family:inherit; font-weight:700; font-size:13.5px; color:var(--paper);}
.pro-banner .pro-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
.pro-banner .pro-tag{font-family:inherit; font-size:9px; color:var(--accent); letter-spacing:1px; text-transform:uppercase; border:1px solid rgba(var(--accent-rgb),.5); border-radius:20px; padding:3px 8px; flex-shrink:0;}

.footer-credit{text-align:center; font-family:inherit; font-size:10px; color:var(--muted); padding:26px 0 8px 0; letter-spacing:.5px;}
.note{font-size:11px; color:var(--muted); text-align:center; padding:16px 0 0 0;}

.row-thumb{width:36px; height:36px; border-radius:9px; object-fit:cover; flex-shrink:0;}
.row-thumb-fallback{display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--muted); font-family:inherit; font-size:14px; border:1px solid var(--line);}
.food-row{cursor:pointer;}
.food-row .rname{gap:10px;}

.pending-photo{width:100%; max-height:220px; object-fit:cover; border-radius:12px; margin-bottom:14px; border:1px solid var(--line-strong);}

.detail-photo{width:100%; height:280px; object-fit:cover; border-radius:16px; border:1px solid var(--line-strong);}
.detail-title-row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-top:14px;}
.detail-title-row h1{font-size:20px; font-weight:800; margin:0; line-height:1.25; letter-spacing:-.3px;}
.pending-name-input{width:100%; border:none; border-bottom:2px solid var(--accent); background:transparent; padding:6px 2px; font-size:19px; font-weight:800; color:var(--paper); font-family:inherit;}
.pending-name-input:focus{outline:none;}
.qty-pill{font-family:inherit; font-size:13px; font-weight:700; padding:7px 12px; border-radius:20px; border:1.5px solid var(--line-strong); background:var(--surface-2); color:var(--paper); cursor:pointer; white-space:nowrap; flex-shrink:0;}
.ingredient-chips{display:flex; flex-wrap:wrap; gap:8px;}
.ingredient-chip{font-size:12px; font-weight:600; padding:7px 12px; border-radius:20px; background:var(--surface-2); border:1px solid var(--line); color:var(--paper);}
.detail-photo-fallback{display:flex; align-items:center; justify-content:center; background:var(--surface-2); font-size:52px; border-radius:14px; border:1px solid var(--line-strong);}
.macro-grid{display:flex; gap:10px;}
.macro-chip{flex:1; border-radius:12px; padding:14px 8px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:5px; border:1px solid var(--line);}
.macro-chip span{font-size:20px;}
.macro-chip b{font-family:inherit; font-size:14px; color:var(--paper);}
.macro-chip small{font-family:inherit; font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}

.supp-btn{font-family:inherit; font-size:11px; font-weight:600; padding:7px 14px; border-radius:20px; border:1.5px solid var(--line-strong); background:transparent; color:var(--muted); cursor:pointer; white-space:nowrap; text-transform:uppercase; letter-spacing:.5px; transition:all .15s ease;}
.supp-btn.taken{background:var(--accent); color:#FFFFFF; border-color:var(--accent);}

.reminder-row{padding:12px 0; border-bottom:1px solid var(--line);}
.reminder-row:last-child{border-bottom:none;}
.reminder-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; gap:10px;}
.reminder-count{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;}
.water-track{height:6px; background:var(--line-strong); border-radius:4px; overflow:hidden;}
.water-fill{height:100%; background:var(--accent); border-radius:4px; transition:width .4s ease;}
.water-fill.is-done{background:var(--protein);}
.supp-btn:disabled{opacity:1; cursor:default;}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">eatis<span class="dot">•</span>easy</div>
    <div class="date" id="header-date"></div>
  </div>

  <div id="screen-today" class="screen"></div>
  <div id="screen-add" class="screen hide"></div>
  <div id="screen-profile" class="screen hide"></div>

  <button class="fab" onclick="setTab('add')" aria-label="Añadir">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <div class="tabbar">
    <button id="tab-today" onclick="setTab('today')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
      <span>Hoy</span>
    </button>
    <button id="tab-profile" onclick="setTab('profile')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>Perfil</span>
    </button>
  </div>
</div>

<div id="onboard" class="overlay hide">
  <div class="overlay-card">
    <div id="onboard-content"></div>
  </div>
</div>

<div id="food-detail" class="overlay hide" onclick="if(event.target===this) closeFoodDetail()">
  <div class="overlay-card" style="position:relative;">
    <button onclick="closeFoodDetail()" style="position:absolute; top:18px; right:18px; background:var(--surface); border:1px solid var(--line); border-radius:50%; width:32px; height:32px; font-size:14px; cursor:pointer;">✕</button>
    <div id="food-detail-body"></div>
  </div>
</div>

<div id="toast" class="toast hide"></div>

<script>
// dual-mode storage: uses Claude's persistent storage when available (auto-save,
// no setup), and falls back to the browser's own localStorage when the app
// runs standalone outside Claude (e.g. embedded in Google Sites) — that way
// closing/reopening the page does NOT reset your data back to zero.
const HAS_CLOUD = (typeof window.storage !== 'undefined');
const LOCAL_PREFIX = 'eatiseasy:';
let HAS_LOCAL_STORAGE = false;
try{
  const testKey = '__eatiseasy_test__';
  localStorage.setItem(testKey, '1');
  localStorage.removeItem(testKey);
  HAS_LOCAL_STORAGE = true;
}catch(e){ HAS_LOCAL_STORAGE = false; }
const memoryStore = {}; // last-resort fallback if localStorage is also blocked

async function safeGet(key){
  if(HAS_CLOUD){
    try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }
  if(HAS_LOCAL_STORAGE){
    try{ const raw = localStorage.getItem(LOCAL_PREFIX + key); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  }
  return Object.prototype.hasOwnProperty.call(memoryStore, key) ? JSON.parse(JSON.stringify(memoryStore[key])) : null;
}
async function safeSet(key, value){
  if(HAS_CLOUD){
    try{ await window.storage.set(key, JSON.stringify(value), false); return true; }
    catch(e){ console.error('storage set failed', e); return false; }
  }
  if(HAS_LOCAL_STORAGE){
    try{ localStorage.setItem(LOCAL_PREFIX + key, JSON.stringify(value)); return true; }
    catch(e){ console.error('localStorage set failed', e); return false; }
  }
  memoryStore[key] = value;
  return true;
}
async function safeDelete(key){
  if(HAS_CLOUD){
    try{ await window.storage.delete(key, false); }catch(e){}
  } else if(HAS_LOCAL_STORAGE){
    try{ localStorage.removeItem(LOCAL_PREFIX + key); }catch(e){}
  } else {
    delete memoryStore[key];
  }
}

async function exportBackupCode(){
  const logDates = (await safeGet('logDates')) || [];
  const logs = {};
  for(const d of logDates){ logs[d] = await safeGet('log:'+d); }
  const payload = { v: 1, profile: state.profile, weights: state.weights, logs };
  const json = JSON.stringify(payload);
  return btoa(unescape(encodeURIComponent(json)));
}
async function importBackupCode(code){
  const clean = code.replace(/\s+/g, '');
  const json = decodeURIComponent(escape(atob(clean)));
  const payload = JSON.parse(json);
  if(!payload || !payload.profile) throw new Error('formato inválido');
  await safeSet('profile', payload.profile);
  await safeSet('weights', payload.weights || []);
  const dates = Object.keys(payload.logs || {});
  for(const d of dates){ await safeSet('log:'+d, payload.logs[d]); }
  await safeSet('logDates', dates);
}

function todayStr(){

// Gramos con máximo 1 decimal en toda la app: round1 para guardar/calcular,
// fmt1 para mostrar (sin ".0" sobrante si es un número entero).
function round1(n){ return Math.round((n || 0) * 10) / 10; }
function fmt1(n){
  const r = round1(n);
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}

function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;

  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ t.className = 'toast hide'; }, 3000);
}

function calcTargets(p){
  if(!p) return null;
  const actMap = { sedentary:1.2, light:1.375, moderate:1.55, active:1.725, veryActive:1.9 };
  const bmr = p.sex === 'male'
    ? 10*p.currentWeight + 6.25*p.heightCm - 5*p.age + 5
    : 10*p.currentWeight + 6.25*p.heightCm - 5*p.age - 161;
  const tdee = bmr * (actMap[p.activityLevel] || 1.375);
  const diff = p.goalWeight - p.currentWeight;

  // goalType: 'auto' infers from current vs goal weight; otherwise it's explicit
  let goalType = p.goalType || 'auto';
  let direction = goalType;
  if(goalType === 'auto'){
    direction = diff < -0.1 ? 'deficit' : (diff > 0.1 ? 'surplus' : 'maintain');
  }

  const adjustment = (p.paceKgWeek || 0.5) * 1100;
  let autoCalorieTarget = tdee;
  if(direction === 'deficit') autoCalorieTarget = tdee - adjustment;
  else if(direction === 'surplus') autoCalorieTarget = tdee + adjustment;
  autoCalorieTarget = Math.max(1200, Math.round(autoCalorieTarget));

  const autoProteinG = round1(1.8 * p.currentWeight);
  const autoProteinCal = autoProteinG * 4;
  const autoRemaining = Math.max(0, autoCalorieTarget - autoProteinCal);
  const autoCarbG = round1((autoRemaining * 0.55) / 4);
  const autoFatG = round1((autoRemaining * 0.45) / 9);

  const isCustom = !!p.customMode;
  const calorieTarget = (isCustom && p.customCalories) ? Math.round(p.customCalories) : autoCalorieTarget;
  const proteinG = (isCustom && p.customProtein != null) ? round1(p.customProtein) : autoProteinG;
  const carbG = (isCustom && p.customCarb != null) ? round1(p.customCarb) : autoCarbG;
  const fatG = (isCustom && p.customFat != null) ? round1(p.customFat) : autoFatG;

  return {
    bmr: Math.round(bmr), tdee: Math.round(tdee), calorieTarget,
    proteinG, carbG, fatG, burnGoal: p.dailyBurnGoal || 300,
    direction, goalType, isCustom,
    autoCalorieTarget, autoProteinG, autoCarbG, autoFatG,
    weeksToGoal: diff !== 0 ? Math.abs(diff / (p.paceKgWeek || 0.5)).toFixed(1) : '0'
  };
}

function decodeJwt(token){
  const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  const json = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  return JSON.parse(json);
}

function handleGoogleCredential(response){
  try{
    const payload = decodeJwt(response.credential);
    obDraft.name = payload.name || obDraft.name;
    obDraft.googleAvatarUrl = payload.picture || null;
    showToast('Hola, ' + (payload.given_name || payload.name || '') + ' 👋');
    renderOnboardStep();
  }catch(e){
    console.error('google credential decode failed', e);
  }
}

function fetchImageAsDataUrl(url, maxDim, quality){
  return new Promise((resolve, reject) => {

    img.onerror = reject;
    img.src = url;
  });
}

function thinBar(label, value, target, color, unit, icon){
  const pct = target > 0 ? Math.min(100, Math.round((value/target)*100)) : 0;
  const over = value > target;
  return `
    <div class="bar-block">
      <div class="bar-top"><span class="lbl">${icon ? icon + ' ' : ''}${label}</span><span class="val">${Math.round(value)} / ${Math.round(target)} ${unit}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${over ? 'var(--warn)' : color};"></div></div>
    </div>`;
}

function ringSvg(net, target, mini){
  const R=80, C=2*Math.PI*R;
  const over = net > target;
  const pct = target>0 ? Math.min(100, (net/target)*100) : 0;
  const offset = C - (pct/100)*C;
  const color = over ? 'var(--warn)' : 'var(--accent)';
  const remain = Math.abs(Math.round(target - net));
  if(mini){
    return `
      <svg class="ring ring-mini" viewBox="0 0 200 200">
        <circle class="ring-track" cx="100" cy="100" r="${R}" stroke-width="16"></circle>
        <circle class="ring-fill" cx="100" cy="100" r="${R}" stroke="${color}" stroke-width="16"
          stroke-dasharray="${C}" stroke-dashoffset="${offset}" transform="rotate(-90 100 100)"></circle>
        <text x="100" y="112" class="ring-num-mini" fill="${color}">${remain}</text>
      </svg>`;
  }
  const label = over ? 'kcal de exceso' : 'kcal restantes';
  return `
    <svg class="ring" viewBox="0 0 200 200">
      <circle class="ring-track" cx="100" cy="100" r="${R}"></circle>
      <circle class="ring-fill" cx="100" cy="100" r="${R}" stroke="${color}"
        stroke-dasharray="${C}" stroke-dashoffset="${offset}" transform="rotate(-90 100 100)"></circle>
      <text x="100" y="96" class="ring-num" fill="${color}">${remain}</text>
      <text x="100" y="120" class="ring-label">${label}</text>
    </svg>`;
}

function macroRingSvg(value, target, color, emoji){
  const R=80, C=2*Math.PI*R;
  const pct = target > 0 ? Math.min(100, (value/target)*100) : 0;
  const offset = C - (pct/100)*C;
  return `
    <svg class="macro-ring" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--line-strong)" stroke-width="16"></circle>
      <circle cx="100" cy="100" r="${R}" fill="none" stroke="${color}" stroke-width="16" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${offset}" transform="rotate(-90 100 100)"></circle>
      <text x="100" y="128" font-size="72" text-anchor="middle">${emoji}</text>
    </svg>`;
}

function weekdayLetterEs(dayIndex){
  // dayIndex: 0=Sunday ... 6=Saturday
  return ['D','L','M','X','J','V','S'][dayIndex];
}

function renderWeekStrip(){
  const today = new Date();
  today.setHours(0,0,0,0);
  const sunday = new Date(today);
  sunday.setDate(today.getDate() - today.getDay());

  let cells = '';
  for(let i=0;i<7;i++){
    const d = new Date(sunday);
    d.setDate(sunday.getDate()+i);
    const dStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const isToday = dStr === todayStr();
    const isPast = d < today;
    const clickable = isToday || (isPast && state.logDates.includes(dStr));
    cells += `
      <div class="week-cell ${isToday ? 'is-today' : ''} ${clickable ? '' : 'is-disabled'}" ${clickable ? `onclick="openDayDetail('${dStr}')"` : ''}>
        <span class="week-letter">${weekdayLetterEs(d.getDay())}</span>
        <span class="week-num">${d.getDate()}</span>
      </div>`;
  }
  return `<div class="week-strip">${cells}</div>`;
}

function renderToday(){
  const t = calcTargets(state.profile);
  const consumed = state.log.foods.reduce((s,f)=>s+f.cal,0);
  const burned = state.log.exercises.reduce((s,e)=>s+e.cal,0);

  const suppRows = state.supplements.map(s=>{
    const count = state.takenToday[s.id] || 0;
    if(s.type === 'water'){
      const target = s.target || 8;
      const done = count >= target;
      const pct = target > 0 ? Math.min(100, Math.round((count/target)*100)) : 0;
      return `<div class="reminder-row">
        <div class="reminder-top">

          </div>
        </div>
        <div class="water-track"><div class="water-fill ${done ? 'is-done' : ''}" style="width:${pct}%;"></div></div>
      </div>`;
    }
    const taken = count > 0;
    return `<div class="row">
      <span class="rname">💊 ${s.name}</span>
      <button class="supp-btn ${taken ? 'taken' : ''}" onclick="toggleSupplement('${s.id}')">${taken ? '✓ Tomado' : 'Marcar'}</button>
    </div>`;
  }).join('');

  document.getElementById('screen-today').innerHTML = `
    ${renderWeekStrip()}

    <div class="hero-card">
      <div class="hero-top">
        <div>
          <div class="hero-number">${remain}</div>
          <div class="hero-label">Calorías restantes</div>
        </div>
        <div class="hero-ring">${ringSvg(consumed, t.calorieTarget, true)}</div>
      </div>
      <div class="hero-sub">Consumidas ${Math.round(consumed)} kcal · Quemadas ${Math.round(burned)} kcal</div>
    </div>

    <div class="macro-row">
      <div class="macro-card">
        <div class="macro-card-num">${fmt1(proteinLeft)}g</div>
        <div class="macro-card-label">Proteína restante</div>
        <div class="macro-ring-wrap">${macroRingSvg(protein, t.proteinG, 'var(--protein)', '🥩')}</div>
      </div>
      <div class="macro-card">
        <div class="macro-card-num">${fmt1(carbsLeft)}g</div>
        <div class="macro-card-label">Carbos restantes</div>
        <div class="macro-ring-wrap">${macroRingSvg(carbs, t.carbG, 'var(--carbs)', '🍞')}</div>
      </div>
      <div class="macro-card">
        <div class="macro-card-num">${fmt1(fatLeft)}g</div>

        <div class="macro-ring-wrap">${macroRingSvg(fat, t.fatG, 'var(--fat)', '🥑')}</div>

    ${state.supplements.length ? `<div class="section-title">🔔 Recordatorios de hoy</div><div class="panel">${suppRows}</div>` : ''}

  const oldServings = f.servings || 1;

  f.cal = Math.round(f.cal * ratio);
  f.protein = round1(f.protein * ratio);
  f.carb = round1(f.carb * ratio);
  f.fat = round1(f.fat * ratio);

  renderToday();

async function incrementWater(id){

  const target = (reminder && reminder.target) || 8;
  const current = state.takenToday[id] || 0;
  if(current >= target) return; // ya completado, no sumar más
  state.takenToday[id] = current + 1;
  await safeSet('suppTaken:' + todayStr(), state.takenToday);
  renderAll();
}

async function loadDaySummaries(){
  const dates = [...(state.logDates||[])].filter(d => d !== todayStr()).sort().reverse().slice(0, 10);
  const summaries = [];
  for(const d of dates){
    const log = await safeGet('log:' + d);
    const consumed = ((log && log.foods) || []).reduce((s,f) => s + f.cal, 0);
    summaries.push({ date: d, consumed });
  }
  return summaries;
}

function resizeToDataUrl(img, maxDim, quality){
  let { width, height } = img;
  if(width > maxDim || height > maxDim){
    if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
    else { width = Math.round(width * (maxDim/height)); height = maxDim; }
  }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  canvas.getContext('2d').drawImage(img, 0, 0, width, height);
  return canvas.toDataURL('image/jpeg', quality);
}

function fileToCompressedBase64(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.src = reader.result; };
    reader.onerror = () => reject(new Error('No se pudo leer la imagen'));
    img.onload = () => {
      const analysisUrl = resizeToDataUrl(img, 1024, 0.8);
      const thumbnail = resizeToDataUrl(img, 720, 0.78);
      resolve({ base64: analysisUrl.split(',')[1], mediaType: 'image/jpeg', thumbnail });
    };
    img.onerror = () => reject(new Error('No se pudo procesar la imagen'));
    reader.readAsDataURL(file);
  });
}

async function callGeminiWithFallback(baseUrlNoKey, apiKey, requestBody){
  // Try method 1: key as URL query param (Google's documented browser method)
  try{
    const resp1 = await fetch(`${baseUrlNoKey}?key=${encodeURIComponent(apiKey)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(requestBody)
    });
    if(resp1.ok) return resp1;
    if(resp1.status !== 401 && resp1.status !== 403) return resp1; // different error, don't retry
  }catch(e){ /* network error, fall through to try method 2 */ }

  // Try method 2: key as x-goog-api-key header
  return fetch(baseUrlNoKey, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
    body: JSON.stringify(requestBody)
  });
}

async function analyzeFoodImage(base64, mediaType, correctionNote){
  const { url, headers, mode, provider, apiKey } = await getPhotoEndpoint();
  const basePrompt = 'Analiza esta foto de comida y estima sus valores nutricionales para la porción mostrada.';
  const correctionPart = correctionNote
    ? ` Esta foto ya se había analizado antes y el usuario dice que el resultado estaba mal, con esta corrección: "${correctionNote}". Ten en cuenta esa corrección y vuelve a estimarlo bien.`
    : '';
  const schemaPart = ' Responde ÚNICAMENTE con un objeto JSON válido, sin texto adicional, sin backticks, exactamente con este formato: {"name":"nombre breve del plato en español","calories":numero_entero,"protein_g":numero_entero,"carbs_g":numero_entero,"fat_g":numero_entero,"health_score":numero_entero_del_1_al_10_donde_10_es_muy_saludable,"ingredients":["ingrediente1","ingrediente2"]} (la lista de ingredients debe tener como máximo 6 elementos breves, en español).';
  const prompt = basePrompt + correctionPart + schemaPart;

  const requestBody = provider === 'gemini'
    ? {
        contents: [{
          parts: [
            { inline_data: { mime_type: mediaType, data: base64 } },
            { text: prompt }
          ]
        }]
      }
    : {
        model: 'claude-sonnet-4-6',
        max_tokens: 500,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
            { type: 'text', text: prompt }
          ]
        }]
      };

  const resp = (provider === 'gemini' && apiKey)
    ? await callGeminiWithFallback(url, apiKey, requestBody)
    : await fetch(url, { method: 'POST', headers, body: JSON.stringify(requestBody) });

  if(!resp.ok){
    const errBody = await resp.text();
    if((resp.status === 401 || resp.status === 403) && mode === 'claude'){
      throw new Error('Esta función solo funciona dentro del chat de Claude, o configurando un proxy/clave gratis de Gemini en Perfil.');
    }
    if((resp.status === 401 || resp.status === 403) && provider === 'gemini'){
      throw new Error('Google rechazó la clave (código ' + resp.status + '). Revisa que la API "Generative Language API" esté activada en tu proyecto de Google Cloud, o crea una clave nueva en aistudio.google.com.');
    }
    throw new Error('HTTP ' + resp.status + ': ' + errBody.slice(0,150));
  }
  const data = await resp.json();
  if(data.error){ throw new Error(data.error.message || 'Error de la API'); }

  const text = provider === 'gemini'
    ? ((data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts || []).map(p=>p.text||'').join('').trim())
    : ((data.content || []).map(b=>b.text || '').join('').trim());
  if(!text) throw new Error('Respuesta vacía del modelo');
  const clean = text.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(clean);
  return {
    name: parsed.name || 'Comida',
    cal: Math.round(parsed.calories) || 0,
    protein: round1(parsed.protein_g) || 0,
    carb: round1(parsed.carbs_g) || 0,
    fat: round1(parsed.fat_g) || 0,
    healthScore: parsed.health_score != null ? Math.max(1, Math.min(10, Math.round(parsed.health_score))) : null,
    ingredients: Array.isArray(parsed.ingredients) ? parsed.ingredients.slice(0,6) : []
  };
}

async function onPhotoSelected(evt){
  const file = evt.target.files[0];
  if(!file) return;
  if(!file.type || !file.type.startsWith('image/')){
    showToast('Elige un archivo de imagen', true);
    return;
  }
  state.analyzing = true;
  renderAdd();
  let succeeded = false;
  try{
    const { base64, mediaType, thumbnail } = await fileToCompressedBase64(file);
    const result = await analyzeFoodImage(base64, mediaType);
    state.pendingFood = { ...result, photo: thumbnail };
    succeeded = true;
  }catch(e){
    console.error('analyze photo failed:', e);
    showToast('No se pudo analizar la foto: ' + e.message, true);
  }finally{
    state.analyzing = false;
    evt.target.value = '';
    renderAdd();
  }
  if(succeeded) openPendingFoodDetail();
}

function sparkSvg(points, goal){
  const w = 380, h = 130, pad = 20;
  const vals = points.map(p=>p.weight).concat([goal]);
  const min = Math.min(...vals) - 1, max = Math.max(...vals) + 1;
  const xStep = (w - pad*2) / (points.length - 1);
  const yFor = v => h - pad - ((v - min)/(max - min)) * (h - pad*2);
  const path = points.map((p,i)=> `${i===0?'M':'L'} ${pad + i*xStep} ${yFor(p.weight)}`).join(' ');
  const goalY = yFor(goal);
  const last = points[points.length-1];
  return `
    <svg class="spark" viewBox="0 0 ${w} ${h}">
      <line x1="${pad}" y1="${goalY}" x2="${w-pad}" y2="${goalY}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 3"></line>
      <text x="${w-pad}" y="${goalY-6}" font-size="9" fill="var(--muted)" text-anchor="end">meta</text>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="${pad+(points.length-1)*xStep}" cy="${yFor(last.weight)}" r="4" fill="var(--accent)"></circle>
    </svg>`;
}

async function logWeight(){

}

function recalcMacrosPreview(){
  const cal = parseFloat(document.getElementById('pr-custom-cal').value) || 0;
  const weight = state.profile.currentWeight;
  const proteinG = Math.round(1.8 * weight);
  const proteinCal = proteinG * 4;
  const remaining = Math.max(0, cal - proteinCal);
  const carbG = Math.round((remaining * 0.55) / 4);
  const fatG = Math.round((remaining * 0.45) / 9);
  document.getElementById('pr-custom-protein').value = proteinG;
  document.getElementById('pr-custom-carb').value = carbG;
  document.getElementById('pr-custom-fat').value = fatG;
}

async function saveProfileEdit(){
  state.profile.currentWeight = parseFloat(document.getElementById('pr-current').value) || state.profile.currentWeight;
  state.profile.goalWeight = parseFloat(document.getElementById('pr-goal').value) || state.profile.goalWeight;
  state.profile.activityLevel = document.getElementById('pr-activity').value;
  state.profile.goalType = document.getElementById('pr-goaltype').value;
  state.profile.paceKgWeek = parseFloat(document.getElementById('pr-pace').value);
  state.profile.dailyBurnGoal = parseFloat(document.getElementById('pr-burn').value) || 300;

  const customMode = document.getElementById('pr-custom-toggle').checked;
  state.profile.customMode = customMode;
  if(customMode){
    state.profile.customCalories = parseFloat(document.getElementById('pr-custom-cal').value) || null;
    state.profile.customProtein = parseFloat(document.getElementById('pr-custom-protein').value);
    state.profile.customCarb = parseFloat(document.getElementById('pr-custom-carb').value);
    state.profile.customFat = parseFloat(document.getElementById('pr-custom-fat').value);
  }

  await safeSet('profile', state.profile);
  showToast('Perfil actualizado');
  renderAll();
}

async function resetAccount(){
  await safeDelete('profile');
  await safeDelete('weights');
  await safeDelete('logDates');
  await reloadApp();
}

init();
</script>
