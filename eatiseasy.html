}

async function openDayDetail(date){
  const t = calcTargets(state.profile);
  const log = date === todayStr() ? state.log : ((await safeGet('log:'+date)) || { foods:[], exercises:[] });
  const consumed = log.foods.reduce((s,f)=>s+f.cal,0);
  const burned = log.exercises.reduce((s,e)=>s+e.cal,0);
  const protein = log.foods.reduce((s,f)=>s+f.protein,0);
  const carbs = log.foods.reduce((s,f)=>s+f.carb,0);
  const fat = log.foods.reduce((s,f)=>s+f.fat,0);

  const scored = log.foods.filter(f => f.healthScore);
  const avgHealth = scored.length ? Math.round(scored.reduce((s,f)=>s+f.healthScore,0) / scored.length) : null;
  const avgHealthColor = avgHealth == null ? 'var(--muted)' : avgHealth >= 7 ? 'var(--protein)' : avgHealth >= 4 ? 'var(--burn)' : 'var(--warn)';

  const budgetDiff = Math.round(t.calorieTarget - consumed);
  const budgetLabel = budgetDiff >= 0 ? `${budgetDiff} kcal por debajo del objetivo` : `${Math.abs(budgetDiff)} kcal por encima del objetivo`;
  const budgetColor = budgetDiff >= 0 ? 'var(--protein)' : 'var(--warn)';

  const dayWeights = (state.weights || []).filter(w => w.date === date).sort((a,b)=> (a.time||'').localeCompare(b.time||''));
  const weightEntry = dayWeights.length ? dayWeights[dayWeights.length-1] : null;

  const takenRaw = (await safeGet('suppTaken:' + date)) || {};
  const remindersCount = state.supplements.length;
  const remindersDone = state.supplements.filter(s => {
    const c = takenRaw[s.id] || 0;
    return s.type === 'water' ? c >= (s.target || 8) : c > 0;
  }).length;

  const proteinPct = t.proteinG > 0 ? Math.round((protein / t.proteinG) * 100) : 0;
  const carbPct = t.carbG > 0 ? Math.round((carbs / t.carbG) * 100) : 0;
  const fatPct = t.fatG > 0 ? Math.round((fat / t.fatG) * 100) : 0;
  const itemCount = log.foods.length + log.exercises.length;
  const times = log.foods.map(f => new Date(f.time)).filter(d => !isNaN(d));
  let timeRangeLabel = null;
  if(times.length){
    const fmtT = d => d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
    const first = new Date(Math.min(...times));
    const last = new Date(Math.max(...times));
    timeRangeLabel = times.length > 1 ? `${fmtT(first)} – ${fmtT(last)}` : fmtT(first);
  }

  const healthBadge = (f) => f.healthScore
    ? `<span style="font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; background:${f.healthScore>=7?'var(--protein-soft)':f.healthScore>=4?'rgba(255,138,61,.15)':'rgba(255,90,60,.12)'}; color:${f.healthScore>=7?'var(--protein)':f.healthScore>=4?'var(--burn)':'var(--warn)'}; margin-left:6px;">${f.healthScore}/10</span>`
    : '';

  const foodRows = log.foods.length ? log.foods.map(f=>`
    <div class="row" style="cursor:pointer;" onclick="openFoodDetailForDate('${f.id}', '${date}')"><span class="rname">
      ${f.photo ? `<img src="${f.photo}" class="row-thumb">` : `<span class="row-thumb row-thumb-fallback">🍽️</span>`}
      ${f.name}${healthBadge(f)}</span><span class="rval">${f.cal} kcal</span></div>`).join('')
    : `<div class="empty">Sin comidas ese día</div>`;
  const exRows = log.exercises.map(e=>`
    <div class="row"><span class="rname">${ICON.fire} ${e.name}</span><span class="rval">${e.cal} kcal</span></div>`).join('');

  document.getElementById('food-detail-body').innerHTML = `
    <h1 style="margin:0 0 2px 0;">${formatDateLabel(date)}</h1>
    <div style="color:var(--muted); font-size:12px; margin-bottom:6px;">Resumen del día</div>
    <div class="ring-wrap" style="margin:0 0 8px 0; padding:10px 0;">${ringSvg(consumed, t.calorieTarget)}</div>
    <div class="macro-grid" style="margin-bottom:14px;">
      <div class="macro-chip" style="background:var(--protein-soft);"><span>${ICON.protein}</span><b>${Math.round(protein)} g</b><small>Proteína</small></div>
      <div class="macro-chip" style="background:var(--carbs-soft);"><span>${ICON.carbs}</span><b>${Math.round(carbs)} g</b><small>Carbohidratos</small></div>
      <div class="macro-chip" style="background:var(--fat-soft);"><span>${ICON.water}</span><b>${Math.round(fat)} g</b><small>Grasas</small></div>
    </div>

    <div class="panel plist" style="margin-bottom:0;">
      <div class="row"><span class="rname">Balance</span><span class="rval" style="color:${budgetColor};">${budgetLabel}</span></div>
      <div class="row"><span class="rname">Quemadas (ejercicio)</span><span class="rval">${burned} kcal</span></div>
      <div class="row"><span class="rname">${ICON.protein} Proteína vs objetivo</span><span class="rval">${proteinPct}%</span></div>
      <div class="row"><span class="rname">${ICON.carbs} Carbohidratos vs objetivo</span><span class="rval">${carbPct}%</span></div>
      <div class="row"><span class="rname">${ICON.water} Grasas vs objetivo</span><span class="rval">${fatPct}%</span></div>
      ${avgHealth != null ? `<div class="row"><span class="rname">${bigEmoji('❤️')} Nota de salud media</span><span class="rval" style="color:${avgHealthColor};">${avgHealth}/10</span></div>` : ''}
      ${weightEntry ? `<div class="row"><span class="rname">⚖️ Peso registrado</span><span class="rval">${fmtWeight(weightEntry.weight)}</span></div>` : ''}
      ${remindersCount ? `<div class="row"><span class="rname">${ICON.bell} Recordatorios</span><span class="rval">${remindersDone}/${remindersCount} completados</span></div>` : ''}
      ${timeRangeLabel ? `<div class="row"><span class="rname">🕐 Horario de comidas</span><span class="rval">${timeRangeLabel}</span></div>` : ''}
      <div class="row"><span class="rname">Elementos registrados</span><span class="rval">${itemCount}</span></div>
    </div>

  document.getElementById('food-detail').classList.remove('hide');
}

async function saveFoodAsTemplateFromBuffer(){
  if(!isPro()){ showToast('Guardar plantillas es una función Pro', true); return; }
  const f = window.__pastDayFoodBuffer;
  const date = window.__pastDayFoodDate;
  if(!f) return;
  if(f.savedAsTemplate){ showToast('Esta comida ya está guardada'); return; }
  const saved = (await safeGet('savedMeals')) || [];
  saved.push({
    id: Date.now().toString(), name: f.name, cal: f.cal, protein: f.protein,
    carb: f.carb, fat: f.fat, photo: f.photo, healthScore: f.healthScore, ingredients: f.ingredients,
    sourceFoodId: f.id, sourceDate: date || null
  });
  await safeSet('savedMeals', saved);
  f.savedAsTemplate = true;
  if(date){
    const targetLog = date === todayStr() ? state.log : ((await safeGet('log:' + date)) || null);
    if(targetLog){
      const idx = targetLog.foods.findIndex(x => x.id === f.id);
      if(idx >= 0) targetLog.foods[idx].savedAsTemplate = true;
      if(date === todayStr()) await saveLog(); else await safeSet('log:' + date, targetLog);
    }
  }
  showToast('Guardado como plantilla ⭐');
  if(date) openFoodDetailForDate(f.id, date);
}

function sparkSvg(pointsKg, goalKg){
  const points = pointsKg.map(p => ({ date: p.date, weight: kgToDisplay(p.weight) }));
  const goal = kgToDisplay(goalKg);
  const w = 380, h = 130, pad = 20;
  const vals = points.map(p=>p.weight).concat([goal]);
  const min = Math.min(...vals) - 1, max = Math.max(...vals) + 1;
  const xStep = points.length > 1 ? (w - pad*2) / (points.length - 1) : 0;
  const yFor = v => h - pad - ((v - min)/(max - min)) * (h - pad*2);
  const goalY = yFor(goal);
  const last = points[points.length-1];

  if(points.length === 1){
    const cx = w/2;
    return `
      <svg class="spark" viewBox="0 0 ${w} ${h}">
        <line x1="${pad}" y1="${goalY}" x2="${w-pad}" y2="${goalY}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 3"></line>
        <text x="${w-pad}" y="${goalY-6}" font-size="9" fill="var(--muted)" text-anchor="end">meta</text>
        <circle cx="${cx}" cy="${yFor(last.weight)}" r="5" fill="var(--accent)"></circle>
      </svg>`;
  }

  const path = points.map((p,i)=> `${i===0?'M':'L'} ${pad + i*xStep} ${yFor(p.weight)}`).join(' ');
  const fillPath = `${path} L ${pad+(points.length-1)*xStep} ${h-pad} L ${pad} ${h-pad} Z`;
  const dots = points.map((p,i)=> `<circle class="weight-dot" cx="${pad+i*xStep}" cy="${yFor(p.weight)}" r="3.2" fill="var(--surface)" stroke="var(--accent)" stroke-width="2" style="transition-delay:${i*40}ms;"></circle>`).join('');
  const gradId = 'wg-' + Math.random().toString(36).slice(2,8);
  const pathId = 'wp-' + Math.random().toString(36).slice(2,8);
  setTimeout(() => animateWeightLine(pathId), 30);
  return `
    <svg class="spark" viewBox="0 0 ${w} ${h}">
      <defs>
        <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line x1="${pad}" y1="${goalY}" x2="${w-pad}" y2="${goalY}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 3"></line>
      <text x="${w-pad}" y="${goalY-6}" font-size="9" fill="var(--muted)" text-anchor="end">meta</text>
      <path d="${fillPath}" fill="url(#${gradId})" stroke="none"></path>
      <path id="${pathId}" d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
      ${dots}
      <circle cx="${pad+(points.length-1)*xStep}" cy="${yFor(last.weight)}" r="4" fill="var(--accent)"></circle>
    </svg>`;
}

function animateWeightLine(pathId){
  const path = document.getElementById(pathId);
  if(!path) return;
  const len = path.getTotalLength();
  path.style.strokeDasharray = len;
  path.style.strokeDashoffset = len;
  path.style.transition = 'none';
  requestAnimationFrame(() => {
    path.style.transition = 'stroke-dashoffset .8s cubic-bezier(.2,.8,.3,1)';
    path.style.strokeDashoffset = '0';
  });
}

          <option value="kg" ${(p.weightUnit||'kg')==='kg'?'selected':''}>Kilogramos (kg)</option>
          <option value="lb" ${p.weightUnit==='lb'?'selected':''}>Libras (lb)</option>
        </select>
      </div>
    </div>

    <div class="section-title">${tr('section_settings')}</div>
    <div class="panel plist">
      <div class="row" style="cursor:pointer;" onclick="openRedoPlanFlow()">
        <span class="rname">🔄 Rehacer mi plan</span>
      </div>
      <div class="row" style="cursor:pointer;" onclick="openEditMacros()">
        <span class="rname">✏️ Editar calorías y macros</span>
      </div>
    </div>

    <div class="section-title">${tr('section_reminders')}</div>
    ${!isPro() ? `
    <div class="panel" style="text-align:center; padding:24px 20px;">
      <div style="font-size:26px; margin-bottom:6px;">${ICON.lock}</div>
      <div style="font-weight:700; font-size:14px; margin-bottom:4px;">Función Pro</div>
      <p class="sub" style="margin:0 0 14px 0;">Suplementos y recordatorios de agua son parte de eatiseasy Pro.</p>
      <button class="btn accent" onclick="setTab('pro')">Desbloquear con Pro</button>
    </div>
    ` : `
    <details>
      <summary>${ICON.bell} Gestionar recordatorios</summary>
      <div class="inner">
        <p style="font-size:12px; color:var(--muted); margin:0 0 12px 0;">Se reinician cada día y aparecen en "Hoy" — suplementos para marcar como tomados, o agua para ir sumando vasos.</p>
        <div class="panel" style="margin-top:0;">
          ${state.supplements.length ? state.supplements.map(s=>`
            <div class="row"><span class="rname">${s.type==='water' ? ICON.water : ICON.pill} ${s.name}${s.type==='water' ? ` · ${s.target||8} vasos/día` : ''}</span><span class="del" onclick="removeSupplement('${s.id}')">✕</span></div>
          `).join('') : `<div class="empty">Aún no has añadido recordatorios</div>`}
        </div>
        <div class="field" style="margin-top:14px;"><label>Tipo</label>
          <select id="new-reminder-type" onchange="toggleReminderTargetField()">
            <option value="supplement">Suplemento</option>
            <option value="water">Agua (vasos al día)</option>
          </select>
        </div>
        <div class="field"><label>Nombre</label><input id="new-reminder-name" placeholder="Vitamina D"></div>
        <div class="field" id="reminder-target-field" style="display:none;">
          <label>Vasos objetivo al día</label><input id="new-reminder-target" type="number" placeholder="8">
          <label style="margin-top:10px;">ML por vaso</label><input id="new-reminder-ml" type="number" placeholder="300" value="300">
        </div>
        <button class="btn accent small" onclick="addReminder()">Añadir</button>
      </div>
    </details>
    `}

    <div class="section-title">${tr('section_account')}</div>
    <div class="panel">
      <p style="font-size:12px; color:var(--muted); margin:0 0 12px 0;">Vincula tu Google para usar tu nombre y foto de perfil automáticamente.</p>
      <div id="google-signin-btn-profile"></div>

      ${p.email ? `
      <div style="margin-top:18px; border-top:1px dashed var(--line); padding-top:16px; display:flex; flex-direction:column; gap:10px;">
        <button class="btn ghost" onclick="manualSaveToCloud()">☁️ Guardar en la nube ahora</button>
      </div>
      ` : ''}

      ${isPro() ? `
      <div style="margin-top:${p.email ? '10px' : '18px'}; ${p.email ? '' : 'border-top:1px dashed var(--line); padding-top:16px;'} display:flex; flex-direction:column; gap:10px;">
        <button class="btn accent" onclick="openTransferGuide()">🔄 Transferir cuenta Pro a otro dispositivo</button>
        <button class="btn ghost" onclick="openManageSubscription()">⚙️ Gestionar suscripción</button>
      </div>
      ` : ''}
    </div>

    ${p.email ? `
    <button class="btn ghost" style="margin-top:14px;" onclick="signOutGoogle()">🚪 Cerrar sesión</button>
    ` : ''}

    <details style="margin-top:${p.email ? '10px' : '14px'};">
      <summary style="color:var(--warn);">Borrar cuenta</summary>
      <div class="inner">
        <button class="btn ghost" onclick="resetAccount()">Confirmar borrado y empezar de nuevo</button>
      </div>
    </details>

    <div class="footer-credit">Desarrollado por Iker Nebreda<br><span style="opacity:.6;">v${APP_VERSION}</span></div>
  `;
  renderGoogleButtonProfile();
}

function copyLicenseCode(){
  if(!state.profile.licenseCode) return;
  navigator.clipboard && navigator.clipboard.writeText(state.profile.licenseCode).then(()=>{
    showToast('Código de licencia copiado');
  }).catch(()=>{ showToast('No se pudo copiar, selecciona el texto a mano', true); });
}

  openActionOverlay(`
    <h1 style="margin:0 0 4px 0;">📲 Instalar eatiseasy</h1>
    <p class="sub" style="margin:0 0 20px 0;">Añádela a tu pantalla de inicio y se abrirá como una app normal, con su icono y sin la barra del navegador.</p>

    <div class="section-title">🍏 En iPhone (Safari)</div>
    <div class="panel plist">
      <div class="row"><span class="rname" style="white-space:normal; max-width:100%;">1. Toca el icono ${ICON.iosShare} (Compartir) abajo en el navegador</span></div>
      <div class="row"><span class="rname" style="white-space:normal; max-width:100%;">2. Baja y toca "Añadir a pantalla de inicio"</span></div>
      <div class="row"><span class="rname" style="white-space:normal; max-width:100%;">3. Toca "Añadir" arriba a la derecha</span></div>
    </div>
    <p class="sub" style="margin:6px 0 0 0;">Importante: tiene que ser en <b>Safari</b> — en Chrome de iPhone no aparece esta opción.</p>

    <div class="section-title" style="margin-top:22px;">🤖 En Android (Chrome)</div>
    <div class="panel plist">
      <div class="row"><span class="rname" style="white-space:normal; max-width:100%;">1. Toca los tres puntos ${ICON.androidDots} arriba a la derecha</span></div>
      <div class="row"><span class="rname" style="white-space:normal; max-width:100%;">2. Toca "Añadir a pantalla de inicio" o "Instalar app"</span></div>

      <h1 style="margin:0 0 10px 0;">🔄 Transferir cuenta Pro</h1>

        <div style="font-size:26px; margin-bottom:6px;">🔗</div>
        <p class="sub" style="margin:0;">Primero vincula tu Google aquí en Perfil — así podemos generar tu código de licencia.</p>
      </div>
    `);
    return;
  }
  await ensureLicenseCode();
  openActionOverlay(`
    <h1 style="margin:0 0 4px 0;">🔄 Transferir cuenta Pro</h1>
    <p class="sub" style="margin:0 0 16px 0;">Así llevas tu Pro a un móvil u ordenador nuevo, sin pagar otra vez.</p>

    <div class="panel" style="margin-top:0;">
      <label style="display:block; font-size:11px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.5px;">Tu código de licencia</label>
      <textarea readonly rows="2" style="width:100%; border:1.5px solid var(--line); border-radius:8px; padding:8px; font-family:inherit; font-size:11px;" onclick="this.select();">${state.profile.licenseCode || ''}</textarea>
      <button class="btn ghost small" style="margin-top:8px;" onclick="copyLicenseCode()">Copiar código</button>
    </div>

    <div class="section-title">Pasos en el dispositivo nuevo</div>
    <div class="panel plist">
      <div class="row"><span class="rname">1. Abre eatiseasy</span><span class="rval">ahí</span></div>
      <div class="row"><span class="rname">2. Ve a la pestaña "Pro"</span></div>
      <div class="row"><span class="rname">3. Baja a "¿Ya tienes Pro en otro dispositivo?"</span></div>

    </div>

// ---------- Rehacer mi plan (como al crear la cuenta, sin perder datos) ----------
function openRedoPlanFlow(){
  const p = state.profile;
  openActionOverlay(`
    <h1 style="margin:0 0 4px 0;">🔄 Rehacer mi plan</h1>
    <p class="sub" style="margin:0 0 18px 0;">Vuelve a poner tus datos y te recalculamos calorías, macros y cuánto deberías quemar — sin tocar tu historial de comidas ni tu peso registrado.</p>

    <div class="row2">
      <div class="field"><label>Edad</label><input id="rp-age" type="number" value="${p.age || ''}"></div>
      <div class="field"><label>Altura (cm)</label><input id="rp-height" type="number" value="${p.heightCm || ''}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Peso actual (${weightUnit()})</label><input id="rp-current" type="number" step="0.1" value="${kgToDisplay(p.currentWeight)}"></div>
      <div class="field"><label>Peso objetivo (${weightUnit()})</label><input id="rp-goal" type="number" step="0.1" value="${kgToDisplay(p.goalWeight)}"></div>
    </div>
    <div class="field"><label>Actividad</label>
      <select id="rp-activity">
        <option value="sedentary" ${p.activityLevel==='sedentary'?'selected':''}>Sedentario</option>
        <option value="light" ${p.activityLevel==='light'?'selected':''}>Ligero</option>
        <option value="moderate" ${p.activityLevel==='moderate'?'selected':''}>Moderado</option>
        <option value="active" ${p.activityLevel==='active'?'selected':''}>Activo</option>
        <option value="veryActive" ${p.activityLevel==='veryActive'?'selected':''}>Muy activo</option>
      </select>
    </div>
    <div class="field"><label>Objetivo</label>
      <select id="rp-goaltype">
        <option value="auto" ${(p.goalType||'auto')==='auto'?'selected':''}>Automático (según tu peso objetivo)</option>
        <option value="deficit" ${p.goalType==='deficit'?'selected':''}>Déficit — perder grasa</option>
        <option value="maintain" ${p.goalType==='maintain'?'selected':''}>Mantenimiento</option>
        <option value="surplus" ${p.goalType==='surplus'?'selected':''}>Superávit — ganar músculo</option>
      </select>
    </div>
    <div class="field"><label>Ritmo (kg/semana)</label>
      <select id="rp-pace">
        <option value="0.25" ${p.paceKgWeek==0.25?'selected':''}>Suave · 0.25 kg</option>
        <option value="0.5" ${p.paceKgWeek==0.5?'selected':''}>Moderado · 0.5 kg</option>
        <option value="0.75" ${p.paceKgWeek==0.75?'selected':''}>Rápido · 0.75 kg</option>
        <option value="1" ${p.paceKgWeek==1?'selected':''}>Intenso · 1 kg</option>
      </select>
    </div>
    <p class="sub" style="margin:8px 0 0 0; font-size:11.5px;">Esto vuelve a calcular tus calorías, macros y kcal a quemar automáticamente — si tenías valores fijados a mano, se sustituyen por los nuevos calculados.</p>
    <button class="btn accent" style="margin-top:16px;" onclick="saveRedoPlan()">Recalcular mi plan</button>
  `);
}
async function saveRedoPlan(){
  const age = parseFloat(document.getElementById('rp-age').value);
  const heightCm = parseFloat(document.getElementById('rp-height').value);
  const current = parseFloat(document.getElementById('rp-current').value);
  const goal = parseFloat(document.getElementById('rp-goal').value);
  if(!age || !heightCm || !current || !goal){ showToast('Rellena todos los campos', true); return; }

  state.profile.age = age;
  state.profile.heightCm = heightCm;
  state.profile.currentWeight = displayToKg(current);
  state.profile.goalWeight = displayToKg(goal);
  state.profile.activityLevel = document.getElementById('rp-activity').value;
  state.profile.goalType = document.getElementById('rp-goaltype').value;
  state.profile.paceKgWeek = parseFloat(document.getElementById('rp-pace').value);
  // Al rehacer el plan entero, volvemos a los valores calculados
  // automáticamente — si quieres fijarlos a mano, usa "Editar calorías y macros".
  state.profile.customMode = false;

  await safeSet('profile', state.profile);
  closeActionOverlay();
  renderAll();
  showToast('¡Plan recalculado! 🎉');
}

// ---------- Editar calorías y macros a mano, sin rehacer el plan ----------
function openEditMacros(){
  const p = state.profile;
  const t = calcTargets(p);
  openActionOverlay(`
    <h1 style="margin:0 0 4px 0;">✏️ Editar calorías y macros</h1>
    <p class="sub" style="margin:0 0 18px 0;">Ajusta directamente tus números, sin tocar tu plan (edad, peso objetivo, ritmo...).</p>

    <div class="field" style="display:flex; align-items:center; gap:10px;">
      <input type="checkbox" id="pr-custom-toggle" ${p.customMode?'checked':''} onchange="toggleCustomFields()" style="width:auto; accent-color:var(--accent);">
      <label style="margin:0; font-size:13px; color:var(--ink);">Fijar yo mismo las calorías y macros diarios</label>
    </div>
    <div id="pr-custom-fields" style="${p.customMode?'':'display:none;'} background:var(--accent-soft); border-radius:12px; padding:14px; margin-top:8px;">
      <div class="field"><label>Calorías objetivo al día</label>
        <input id="pr-custom-cal" type="number" value="${p.customCalories || t.autoCalorieTarget}" oninput="recalcMacrosPreview()">
      </div>
      <div class="row2">
        <div class="field"><label>${ICON.protein} Proteína (g)</label><input id="pr-custom-protein" type="number" value="${p.customProtein != null ? p.customProtein : t.autoProteinG}"></div>
        <div class="field"><label>${ICON.water} Grasas (g)</label><input id="pr-custom-fat" type="number" value="${p.customFat != null ? p.customFat : t.autoFatG}"></div>
      </div>
      <div class="field"><label>${ICON.carbs} Carbohidratos (g)</label><input id="pr-custom-carb" type="number" value="${p.customCarb != null ? p.customCarb : t.autoCarbG}"></div>
      <div class="field"><label>Objetivo kcal quemadas/día (ejercicio)</label><input id="pr-custom-burn" type="number" value="${p.customBurnGoal != null ? p.customBurnGoal : t.autoBurnGoal}"></div>
      <button type="button" class="btn ghost small" onclick="recalcMacrosPreview()">↻ Recalcular macros según estas calorías</button>
      <p style="font-size:11px; color:var(--muted); margin:10px 0 0 0;">Puedes tocar los gramos y dejarlos como quieras — el botón solo te da un punto de partida sugerido.</p>
    </div>
    <p class="sub" style="margin:12px 0 0 0; font-size:11.5px;">Si desmarcas la casilla, volvemos a calcular tus calorías y macros automáticamente según tu plan actual.</p>

    <button class="btn accent" style="margin-top:16px;" onclick="saveEditMacros()">Guardar cambios</button>
  `);
}
function toggleCustomFields(){
  const checked = document.getElementById('pr-custom-toggle').checked;
  document.getElementById('pr-custom-fields').style.display = checked ? 'block' : 'none';
}
function recalcMacrosPreview(){
  const cal = parseFloat(document.getElementById('pr-custom-cal').value) || 0;
  const weight = state.profile.currentWeight;
  const proteinG = Math.round(1.8 * weight);
  const proteinCal = proteinG * 4;
  const remaining = Math.max(0, cal - proteinCal);
  const carbG = Math.round((remaining * 0.55) / 4);
  const fatG = Math.round((remaining * 0.45) / 9);
  document.getElementById('pr-custom-protein').value = proteinG;
  document.getElementById('pr-custom-carb').value = carbG;
  document.getElementById('pr-custom-fat').value = fatG;
}
async function saveEditMacros(){
  const customMode = document.getElementById('pr-custom-toggle').checked;
  state.profile.customMode = customMode;
  if(customMode){
    state.profile.customCalories = parseFloat(document.getElementById('pr-custom-cal').value) || null;
    state.profile.customProtein = parseFloat(document.getElementById('pr-custom-protein').value);
    state.profile.customCarb = parseFloat(document.getElementById('pr-custom-carb').value);
    state.profile.customFat = parseFloat(document.getElementById('pr-custom-fat').value);
    state.profile.customBurnGoal = parseFloat(document.getElementById('pr-custom-burn').value);
  }
  await safeSet('profile', state.profile);
  closeActionOverlay();
  renderAll();
  showToast('Calorías y macros actualizados');
}


async function manualSaveToCloud(){
  if(!state.profile.email){
    showToast('Primero vincula tu Google', true);
    return;
  }
  if(!SYNC_ENDPOINT || !googleIdToken){
    showToast('La sincronización con la nube no está disponible ahora mismo', true);
    return;
  }
  showToast('Guardando en la nube…');
  await pushToCloud();
  showToast('¡Guardado en la nube! ☁️');
}

async function signOutGoogle(){
  openActionOverlay(`
    <h1 style="margin:0 0 10px 0;">🚪 Cerrar sesión</h1>
    <p class="sub" style="margin:0 0 20px 0;">Se desvincula tu Google de este dispositivo. Tus datos locales NO se borran — solo dejarás de sincronizarlos con la nube hasta que vuelvas a iniciar sesión.</p>
    <button class="btn accent" onclick="confirmSignOutGoogle()">Cerrar sesión</button>
    <button class="btn ghost small" style="margin-top:10px;" onclick="closeActionOverlay()">Cancelar</button>
  `);
}
async function confirmSignOutGoogle(){
  state.profile.email = null;
  googleIdToken = null;
  await safeSet('profile', state.profile);
  closeActionOverlay();
  renderAll();
  showToast('Sesión cerrada');
}

async function resetAccount(){
  await safeDelete('profile');
  await safeDelete('weights');
  await safeDelete('logDates');
  await reloadApp();
}

function renderStaticMenus(){
  document.getElementById('add-menu-body').innerHTML = `
    <button class="fab-option" onclick="closeAddMenu(); openScanChoice();">
      <span class="fab-option-icon">${ICON.camera}</span> Registrar comida
    </button>
    <button class="fab-option" onclick="closeAddMenu(); openFoodSearch();">
      <span class="fab-option-icon">${bigEmoji('🔍')}</span> Buscar alimento
    </button>
    ${!isPro() ? `
    <button class="fab-option" onclick="closeAddMenu(); openManualFoodForm();">
      <span class="fab-option-icon">${bigEmoji('📝')}</span> Registrar manualmente
    </button>
    ` : ''}
    <button class="fab-option" onclick="closeAddMenu(); openSavedMeals();">
      <span class="fab-option-icon">${ICON.star}</span> ${tr('saved_meal')}
    </button>
    <button class="fab-option" onclick="closeAddMenu(); openExercisePicker();">
      <span class="fab-option-icon">${bigEmoji('🏃')}</span> ${tr('register_exercise')}
    </button>
  `;
}

renderStaticMenus();
init();
</script>

</html>
