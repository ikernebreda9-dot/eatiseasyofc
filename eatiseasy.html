<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eatiseasy</title>
<link rel="icon" type="image/png" href="eie-st.png">
<link rel="apple-touch-icon" href="eie-st.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  /* Watermelon palette — piel (rind), pulpa (flesh), pepitas (seeds) */
  --void:#FAFBF6; --surface:#FFFFFF; --surface-2:#F1F7ED; --paper:#182D1E; --muted:#84937F;
  --void-rgb:250,251,246; --surface-rgb:255,255,255;
  --line:rgba(24,45,30,.08); --line-strong:rgba(24,45,30,.16);
  --accent:#FF4D6D; --accent-dark:#D6293F; --accent-soft:rgba(255,77,109,.12); --accent-rgb:255,77,109;
  --warn:#C8391F;
  --protein:#1E8449; --protein-soft:rgba(30,132,73,.12); --protein-rgb:30,132,73;
  --carbs:#F0405C; --carbs-soft:rgba(240,64,92,.12);
  --fat:#2B2B2B; --fat-soft:rgba(43,43,43,.08);
  --burn:#FF8A3D;
}
/* Sandía de noche — misma paleta, de noche. Las pepitas negras pasan a un
   tono cálido claro porque el negro se hunde en un fondo oscuro. */
body.dark-mode{
  --void:#12201A; --surface:#1B2B22; --surface-2:#23362B; --paper:#F1EFE3; --muted:#8FA090;
  --void-rgb:18,32,26; --surface-rgb:27,43,34;
  --line:rgba(241,239,227,.08); --line-strong:rgba(241,239,227,.16);
  --accent-dark:#FF7A93;
  --warn:#FF7A5C;
  --protein-soft:rgba(76,175,114,.18);
  --carbs-soft:rgba(240,64,92,.22);
  --fat:#D8C89A; --fat-soft:rgba(216,200,154,.16);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0; background:var(--void); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--paper); -webkit-font-smoothing:antialiased; transition:background .25s ease, color .25s ease;}
.app{max-width:480px; margin:0 auto; min-height:100vh; background:
    radial-gradient(circle at 12% 0%, rgba(var(--accent-rgb),.10), transparent 55%),
    radial-gradient(circle at 88% 26%, rgba(var(--protein-rgb),.08), transparent 55%),
    radial-gradient(circle at 20% 90%, rgba(var(--accent-rgb),.06), transparent 50%),
    var(--void);
  position:relative; padding-bottom:calc(74px + env(safe-area-inset-bottom));}
.hide{display:none !important;}
.serif{font-family:inherit;}
.mono{font-family:inherit;}

.topbar{position:sticky; top:0; z-index:20; padding:22px 20px 16px 20px; display:flex; align-items:baseline; justify-content:space-between; background:rgba(var(--void-rgb),.72); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%); border-bottom:1px solid var(--line); margin-bottom:-12px;}
.topbar .brand{font-family:inherit; font-size:19px; font-weight:600; letter-spacing:-.2px; color:var(--paper); display:flex; align-items:center; gap:8px;}
.brand-icon{width:26px; height:26px; border-radius:50%; object-fit:cover;}
.topbar .brand .dot{color:var(--accent);}
.topbar .date{font-family:inherit; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}
.header-streak{font-size:11px; font-weight:700; color:var(--accent); margin-top:3px;}
.screen{padding:2px 20px 24px 20px; position:relative;}

.ring-wrap{display:flex; justify-content:center; padding:22px 0 8px 0;}

.week-strip{display:flex; padding:16px 0 4px 0; gap:4px; overflow-x:auto; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.week-strip::-webkit-scrollbar{display:none;}
.week-cell{display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0; border-radius:14px; flex:0 0 58px; cursor:pointer; scroll-snap-align:end;}
.week-cell.is-disabled{cursor:default; opacity:.4;}
.week-letter{font-size:11px; color:var(--muted); font-weight:600;}
.week-num{font-size:13px; font-weight:700; color:var(--paper); width:26px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:50%;}
.week-cell.is-today .week-num{background:var(--paper); color:var(--void);}

.hero-card{background:var(--surface); border-radius:20px; padding:22px 22px 18px 22px; margin-top:12px; border:1px solid var(--line); box-shadow:0 2px 10px rgba(24,45,30,.06);}
.hero-top{display:flex; align-items:center; justify-content:space-between;}
.hero-number{font-size:40px; font-weight:800; letter-spacing:-1px; line-height:1;}
.hero-label{font-size:13px; color:var(--muted); margin-top:4px; font-weight:600;}
.hero-ring svg{width:104px; height:104px;}

.macro-card{flex:1; background:var(--surface); border-radius:16px; padding:14px 8px 16px 8px; border:1px solid var(--line); box-shadow:0 2px 10px rgba(24,45,30,.05); text-align:center; display:flex; flex-direction:column; align-items:center;}
.macro-card-num{font-size:17px; font-weight:800; letter-spacing:-.3px;}
.macro-card-label{font-size:10px; color:var(--muted); font-weight:600; margin:2px 0 10px 0; line-height:1.25;}
.macro-ring-wrap{width:64px; height:64px;}
.macro-ring{width:100%; height:100%;}
.hero-sub{font-size:11.5px; color:var(--muted); margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}

.macro-row{display:flex; gap:10px; margin-top:12px;}

.log-card2{position:relative; display:flex; gap:14px; background:var(--surface); border-radius:18px; padding:12px; margin-top:10px; border:1px solid var(--line); box-shadow:0 2px 8px rgba(24,45,30,.05); cursor:pointer;}
.log-photo{width:84px; height:84px; border-radius:14px; overflow:hidden; flex-shrink:0; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:30px;}
.log-photo img{width:100%; height:100%; object-fit:cover;}
.log-body{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:7px;}
.log-top{display:flex; align-items:center; gap:8px;}
.log-title{flex:1; min-width:0; font-size:16px; font-weight:800; letter-spacing:-.2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.log-time{font-size:10.5px; font-weight:700; background:var(--surface-2); border:1px solid var(--line); border-radius:20px; padding:4px 10px; flex-shrink:0; color:var(--muted); white-space:nowrap;}
.log-cal{font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:6px;}
.log-macros{display:flex; gap:14px; font-size:12.5px; font-weight:700;}
.log-macros span{display:flex; align-items:center; gap:4px;}
.log-card2 .del{background:none; border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); flex-shrink:0;}
.ring{width:210px; height:210px; filter:drop-shadow(0 4px 16px rgba(var(--accent-rgb),.28));}
.ring-track{fill:none; stroke:var(--protein); opacity:1; stroke-width:9; stroke-opacity:.28;}
.ring-fill{fill:none; stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);}
.ring-num{font-family:inherit; font-size:42px; font-weight:600; text-anchor:middle;}
.ring-num-mini{font-family:inherit; font-size:44px; font-weight:600; text-anchor:middle;}
.ring-label{font-family:inherit; font-size:10px; text-anchor:middle; fill:var(--muted); letter-spacing:1.5px; text-transform:uppercase;}

.mini-history-strip{display:flex; gap:16px; overflow-x:auto; padding:4px 2px 12px 2px; -webkit-overflow-scrolling:touch;}
.mini-history-strip::-webkit-scrollbar{display:none;}
.mini-day{display:flex; flex-direction:column; align-items:center; gap:5px; flex-shrink:0; cursor:pointer;}
.mini-day-label{font-family:inherit; font-size:9px; font-weight:600; color:var(--muted); text-transform:uppercase;}
.mini-day .ring-mini{width:52px; height:52px;}

.section-title{font-family:inherit; font-size:10px; font-weight:700; color:var(--protein); text-transform:uppercase; letter-spacing:1.5px; margin:26px 0 10px 2px;}

.bar-block{margin-bottom:18px;}
.bar-top{display:flex; align-items:center; justify-content:space-between; font-size:13px; margin-bottom:7px;}
.bar-top .lbl{display:flex; align-items:center; gap:8px;}
.bar-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.bar-top .val{font-family:inherit; color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px;}
.bar-track{height:3px; background:var(--line-strong); border-radius:2px; overflow:hidden;}
.bar-fill{height:100%; border-radius:2px; transition:width .5s cubic-bezier(.4,0,.2,1);}

.row{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--line); font-size:14px;}
.row:last-child{border-bottom:none;}
.row .rname{display:flex; align-items:center; gap:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:70%; color:var(--paper); font-weight:500;}
.row .rval{display:flex; align-items:center; gap:10px; font-family:inherit; font-variant-numeric:tabular-nums; color:var(--paper); font-size:13px;}
.row .del{color:var(--muted); font-size:15px; line-height:1; cursor:pointer; padding:4px;}
.empty{color:var(--muted); font-size:13px; padding:18px 0; text-align:center; font-style:italic; font-family:inherit;}
.panel{background:var(--surface); border-radius:14px; padding:16px 18px; margin-top:14px; border:1px solid var(--line); box-shadow:0 2px 10px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04); transition:box-shadow .2s ease, transform .15s ease;}

.field{margin-bottom:14px;}
.field label{display:block; font-family:inherit; font-size:10px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.8px;}
.field input, .field select{width:100%; border:none; border-bottom:1.5px solid var(--line-strong); background:transparent; padding:8px 2px; font-size:15px; color:var(--paper); font-family:inherit;}
.field input::placeholder{color:var(--muted); opacity:.6;}
.field input:focus, .field select:focus{outline:none; border-color:var(--accent);}
.field select option{background:var(--surface); color:var(--paper);}

.ob-hero-icon{width:64px; height:64px; border-radius:50%; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:30px; margin:4px auto 18px auto; overflow:hidden;}
.ob-hero-icon img{width:100%; height:100%; object-fit:cover;}
.ob-divider{display:flex; align-items:center; gap:12px; color:var(--muted); font-size:11px; margin:6px 0 20px 0;}
.ob-divider:before, .ob-divider:after{content:''; flex:1; height:1px; background:var(--line-strong);}
.ob-name-input{width:100%; text-align:center; border:none; border-bottom:2px solid var(--accent); background:transparent; padding:10px 2px; font-size:23px; font-weight:700; color:var(--paper); font-family:inherit;}
.ob-name-input::placeholder{color:var(--muted); opacity:.5; font-weight:600;}
.ob-name-input:focus{outline:none;}
.ob-sex-toggle{display:flex; gap:10px; margin-top:6px;}

.plan-toggle{display:flex; gap:8px; justify-content:center;}
.plan-toggle-btn{padding:10px 16px; border-radius:14px; border:1.5px solid var(--line-strong); background:var(--surface); font-family:inherit; font-weight:700; font-size:13px; color:var(--muted); cursor:pointer; display:flex; align-items:center; gap:6px;}
.plan-toggle-btn.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark);}
.plan-save-badge{background:var(--rind); color:#fff; font-size:9px; font-weight:800; padding:2px 6px; border-radius:8px;}
.ob-sex-btn{flex:1; padding:16px 0; border-radius:16px; border:1.5px solid var(--line-strong); background:var(--surface); font-family:inherit; font-weight:700; font-size:14px; color:var(--muted); cursor:pointer; transition:all .15s ease;}
.ob-sex-btn.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark);}

.ob-chip-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
.ob-chip{font-family:inherit; font-size:12.5px; font-weight:600; padding:9px 14px; border-radius:20px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--muted); cursor:pointer;}
.ob-chip.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark); font-weight:700;}
.row2{display:flex; gap:16px;}
.row2 .field{flex:1;}

.btn{font-family:inherit; font-weight:700; font-size:14px; padding:14px; border:none; border-radius:10px; cursor:pointer; background:var(--surface-2); color:var(--paper); width:100%; border:1px solid var(--line-strong); transition:transform .12s ease;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.4;}
.btn.accent{background:var(--accent); color:#FFFFFF; border-color:var(--accent);}
.btn.ghost{background:transparent; color:var(--paper); border:1.5px solid var(--line-strong);}
.btn.small{width:auto; padding:9px 16px; font-size:12.5px; border-radius:9px;}

details{margin-top:12px;}
details summary{list-style:none; cursor:pointer; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--accent); padding:4px 0;}
details summary::-webkit-details-marker{display:none;}
details summary:before{content:'+ ';}
details[open] summary:before{content:'– ';}
details .inner{padding-top:10px;}

.photo-btn{display:block; width:100%; padding:22px; text-align:center; border-radius:14px; background:var(--surface); color:var(--accent); font-family:inherit; font-weight:700; font-size:13.5px; cursor:pointer; border:1.5px dashed var(--line-strong);}

.today-content{transition:filter .25s ease;}
.today-content.is-blurred{filter:blur(10px); pointer-events:none; user-select:none;}
.analyzing-overlay{position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:20px;}
.analyzing-ring{width:120px; height:120px; position:relative;}
.analyzing-ring-bg{stroke:var(--line-strong);}
#analyzing-ring-fill{stroke:var(--accent); transition:stroke-dashoffset .1s linear;}
.analyzing-pct{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-family:inherit; font-size:24px; font-weight:800; color:var(--paper); pointer-events:none;}
.analyzing-msg{font-size:13.5px; font-weight:700; color:var(--paper); text-align:center; background:var(--surface); padding:10px 18px; border-radius:20px; box-shadow:0 6px 20px rgba(0,0,0,.12);}
.visually-hidden-file{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}

.dim-overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:150; display:flex; align-items:flex-end; justify-content:center; padding:0 20px calc(110px + env(safe-area-inset-bottom)) 20px;}
.fab-menu{display:flex; flex-direction:column; gap:12px; width:100%; max-width:400px;}
.fab-option{display:flex; align-items:center; gap:12px; background:rgba(var(--surface-rgb),.78); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%); color:var(--paper); border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:15px 18px; font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,.16), 0 1px 2px rgba(0,0,0,.08); animation:fabIn .25s ease both; transition:transform .12s ease, box-shadow .12s ease;}
.fab-option:active{transform:scale(.97);}
.fab-option-icon{font-size:19px;}

.exercise-search{width:100%; border:1.5px solid var(--line-strong); border-radius:12px; padding:10px 14px; font-family:inherit; font-size:14px; margin-top:12px; background:var(--surface-2); color:var(--paper);}
.exercise-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; max-height:52vh; overflow-y:auto; padding-bottom:4px;}
.exercise-type-btn{display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line-strong); border-radius:14px; padding:16px 8px; font-family:inherit; font-weight:700; font-size:12px; color:var(--paper); cursor:pointer;}
.exercise-type-btn span{font-size:26px;}
@keyframes fabIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

.splash-screen{position:fixed; inset:0; background:var(--void); z-index:200; display:flex; align-items:center; justify-content:center; padding:40px; text-align:center; transition:opacity .3s ease;}
.splash-screen.fade-out{opacity:0;}
.splash-inner{display:flex; flex-direction:column; align-items:center; gap:16px;}
.splash-logo{font-size:30px; font-weight:800; letter-spacing:-.5px; color:var(--paper); opacity:0; transform:scale(.9); transition:opacity .4s ease, transform .4s cubic-bezier(.2,.8,.3,1);}
.splash-logo.show{opacity:1; transform:scale(1);}
.splash-logo .dot{color:var(--accent);}
.splash-greeting{font-size:16px; font-weight:600; color:var(--muted); opacity:0; transition:opacity .4s ease .1s;}
.splash-greeting.show{opacity:1;}
.splash-progress-track{width:170px; height:5px; background:var(--line-strong); border-radius:4px; overflow:hidden; margin-top:6px;}
.splash-progress-fill{height:100%; width:0%; background:var(--accent); border-radius:4px;}

.toast{position:fixed; bottom:calc(88px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--paper); color:var(--void); padding:10px 16px; border-radius:10px; font-size:12.5px; max-width:82%; text-align:center; z-index:60; font-weight:600;}
.toast.err{background:var(--warn); color:#fff;}

.tabbar{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; background:rgba(21,20,15,.9); backdrop-filter:blur(14px); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding-bottom:env(safe-area-inset-bottom); z-index:30;}
.tabbar button{flex:1; background:none; border:none; padding:12px 4px 10px 4px; color:var(--muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;}
.tabbar button.active{color:var(--accent);}
.tabbar svg{width:21px; height:21px;}
.tabbar span{font-family:inherit; font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;}

.fab{position:fixed; right:calc((100vw - min(100vw,480px))/2 + 18px); bottom:calc(84px + env(safe-area-inset-bottom)); width:52px; height:52px; border-radius:50%; background:var(--accent); color:#FFFFFF; border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 20px rgba(var(--accent-rgb),.4); z-index:35; cursor:pointer; transition:transform .12s ease;}
.fab:active{transform:scale(.93);}
.fab svg{width:23px; height:23px; stroke:#FFFFFF !important;}

.overlay{position:fixed; inset:0; background:var(--void); z-index:100; overflow-y:auto; display:flex; justify-content:center;}
.overlay-card{max-width:480px; width:100%; padding:32px 20px calc(28px + env(safe-area-inset-bottom)) 20px;}

#action-overlay.fullbleed{align-items:stretch;}
#action-overlay.fullbleed .overlay-card{padding:0; max-width:100%; height:100dvh;}
#action-overlay.fullbleed #action-overlay-close{background:rgba(255,255,255,.9); color:#111;}
.camera-view{position:relative; width:100%; height:100dvh; background:#000; overflow:hidden;}
.camera-view video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000;}

.camera-viewfinder{position:absolute; top:22%; left:8%; right:8%; bottom:34%; pointer-events:none;}
.vf-corner{position:absolute; width:26px; height:26px; border-color:rgba(255,255,255,.85); border-style:solid; border-width:0;}
.vf-tl{top:0; left:0; border-top-width:3px; border-left-width:3px; border-radius:8px 0 0 0;}
.vf-tr{top:0; right:0; border-top-width:3px; border-right-width:3px; border-radius:0 8px 0 0;}
.vf-bl{bottom:0; left:0; border-bottom-width:3px; border-left-width:3px; border-radius:0 0 0 8px;}
.vf-br{bottom:0; right:0; border-bottom-width:3px; border-right-width:3px; border-radius:0 0 8px 0;}

.camera-top-row{position:absolute; top:calc(18px + env(safe-area-inset-top)); left:0; right:0; display:flex; justify-content:center; z-index:2;}
.camera-badge{background:rgba(0,0,0,.55); backdrop-filter:blur(10px); color:#fff; font-family:inherit; font-weight:700; font-size:14px; padding:9px 18px; border-radius:30px;}
.camera-badge .dot{color:var(--accent);}

.camera-bottom-panel{position:absolute; left:0; right:0; bottom:0; z-index:2; display:flex; flex-direction:column; align-items:center; gap:14px; padding:0 20px calc(22px + env(safe-area-inset-bottom)) 20px; background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0) 85%);}
.camera-status-text{text-align:center; color:#fff; font-size:13px; font-weight:600; text-shadow:0 1px 4px rgba(0,0,0,.6); min-height:18px;}

.camera-seg-row{display:flex; align-items:stretch; background:rgba(255,255,255,.95); backdrop-filter:blur(10px); border-radius:18px; overflow:hidden; width:100%; max-width:340px;}
.cam-seg{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-family:inherit; font-size:10.5px; font-weight:700; padding:12px 4px; border:none; border-right:1px solid rgba(0,0,0,.08); background:transparent; color:#666; cursor:pointer;}
.cam-seg:last-child{border-right:none;}
.cam-seg svg{width:18px; height:18px;}
.cam-seg.active{background:var(--accent); color:#fff;}

.qf-list{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
.qf-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px; cursor:pointer;}
.qf-icon{font-size:22px; flex-shrink:0;}
.qf-body{flex:1; min-width:0;}
.qf-name{font-weight:700; font-size:14px;}
.qf-sub{font-size:12px; color:var(--muted); margin-top:2px;}

<script>
// dual-mode storage: uses Claude's persistent storage when available (auto-save,
// no setup), and falls back to the browser's own localStorage when the app
// runs standalone outside Claude (e.g. embedded in Google Sites) — that way
// closing/reopening the page does NOT reset your data back to zero.
const HAS_CLOUD = (typeof window.storage !== 'undefined');
const LOCAL_PREFIX = 'eatiseasy:';
let HAS_LOCAL_STORAGE = false;
try{
  const testKey = '__eatiseasy_test__';
  localStorage.setItem(testKey, '1');
  localStorage.removeItem(testKey);
  HAS_LOCAL_STORAGE = true;
}catch(e){ HAS_LOCAL_STORAGE = false; }
const memoryStore = {}; // last-resort fallback if localStorage is also blocked

async function safeGet(key){
  if(HAS_CLOUD){
    try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }
  if(HAS_LOCAL_STORAGE){
    try{ const raw = localStorage.getItem(LOCAL_PREFIX + key); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  }
  return Object.prototype.hasOwnProperty.call(memoryStore, key) ? JSON.parse(JSON.stringify(memoryStore[key])) : null;
}
async function safeSet(key, value){
  scheduleSync();
  if(HAS_CLOUD){
    try{ await window.storage.set(key, JSON.stringify(value), false); return true; }
    catch(e){ console.error('storage set failed', e); return false; }
  }
  if(HAS_LOCAL_STORAGE){
    try{ localStorage.setItem(LOCAL_PREFIX + key, JSON.stringify(value)); return true; }
    catch(e){ console.error('localStorage set failed', e); return false; }
  }
  memoryStore[key] = value;
  return true;
}
async function safeDelete(key){
  if(HAS_CLOUD){
    try{ await window.storage.delete(key, false); }catch(e){}
  } else if(HAS_LOCAL_STORAGE){
    try{ localStorage.removeItem(LOCAL_PREFIX + key); }catch(e){}
  } else {
    delete memoryStore[key];
  }
}
async function saveLog(){
  await safeSet(logKey(), state.log);
  const dates = (await safeGet('logDates')) || [];
  if(!dates.includes(todayStr())){
    dates.push(todayStr());
    await safeSet('logDates', dates);
  }
  state.logDates = dates;
}

// ---------- backup code (export/import full account as text) ----------
async function gatherAllLocalData(){
  const logDates = (await safeGet('logDates')) || [];
  const logs = {};
  for(const d of logDates){ logs[d] = await safeGet('log:'+d); }
  const supplements = (await safeGet('supplements')) || [];
  const savedMeals = (await safeGet('savedMeals')) || [];
  return { v: 3, profile: state.profile, weights: state.weights, logs, supplements, savedMeals };
}
async function applyAllLocalData(payload){
  if(!payload || !payload.profile) throw new Error('formato inválido');
  await safeSet('profile', payload.profile);
  await safeSet('weights', payload.weights || []);
  const dates = Object.keys(payload.logs || {});
  for(const d of dates){ await safeSet('log:'+d, payload.logs[d]); }
  await safeSet('logDates', dates);
  await safeSet('supplements', payload.supplements || []);
  await safeSet('savedMeals', payload.savedMeals || []);
}

// ---------- sincronización en la nube (atada a tu Google) ----------
// Pega aquí la URL de tu Worker eatiseasy-sync (ej.
// 'https://eatiseasy-sync.tuusuario.workers.dev'). Mientras esté vacío,
// la app sigue funcionando solo en local, como hasta ahora.
const SYNC_ENDPOINT = 'https://eatiseasyacounts.ikernebreda9.workers.dev';

let googleIdToken = null;
let syncTimer = null;

function scheduleSync(){
  if(!SYNC_ENDPOINT || !googleIdToken) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushToCloud, 2000);
}

async function pushToCloud(){
  if(!SYNC_ENDPOINT || !googleIdToken) return;
  try{
    const data = await gatherAllLocalData();
    await fetch(SYNC_ENDPOINT + '/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + googleIdToken },
      body: JSON.stringify({ data })
    });
  }catch(e){
    console.error('pushToCloud failed', e);
  }
}

async function pullFromCloud(){
  if(!SYNC_ENDPOINT || !googleIdToken) return null;
  try{
    const resp = await withTimeout(
      fetch(SYNC_ENDPOINT + '/load', { headers: { 'Authorization': 'Bearer ' + googleIdToken } }),
      8000, 'La nube ha tardado demasiado en responder'
    );
    const json = await resp.json();
    return json.data || null;
  }catch(e){
    console.error('pullFromCloud failed', e);
    return null;
  }
}

// Se llama justo después de iniciar sesión con Google. Si hay datos
// guardados en la nube, deja elegir entre recuperarlos o quedarse con
// los de este dispositivo (para no pisar nada sin avisar).
async function checkCloudAfterSignIn(){
  if(!SYNC_ENDPOINT || !googleIdToken) return;
  const cloud = await pullFromCloud();
  const localHasData = state.log.foods.length > 0 || (state.logDates && state.logDates.length > 0);
  if(cloud && cloud.data && cloud.data.profile){
    if(localHasData){
      openActionOverlay(`
        <h1 style="margin:0 0 10px 0;">☁️ Hay datos guardados en la nube</h1>
        <p class="sub" style="margin:0 0 20px 0;">Esta cuenta de Google ya tiene datos de eatiseasy guardados de antes. ¿Qué quieres hacer?</p>
        <button class="btn accent" onclick="restoreFromCloudChoice()">Recuperar de la nube (sustituye lo de este dispositivo)</button>
        <button class="btn ghost" style="margin-top:10px;" onclick="keepLocalChoice()">Mantener este dispositivo (sube esto a la nube)</button>
      `);
    } else {
      await applyAllLocalData(cloud.data);
      await reloadApp();
      showToast('Datos recuperados de la nube ☁️');
    }
  } else {
    scheduleSync();
  }
}
async function restoreFromCloudChoice(){
  const cloud = await pullFromCloud();
  if(cloud && cloud.data){
    await applyAllLocalData(cloud.data);
    await reloadApp();
    showToast('Datos recuperados de la nube ☁️');
  }
  closeActionOverlay();
}
function keepLocalChoice(){
  scheduleSync();
  closeActionOverlay();
  showToast('Subiendo este dispositivo a la nube…');
}

function showSplash(){
  return new Promise(resolve => {
    const overlay = document.getElementById('splash-screen');
    const logoEl = overlay ? overlay.querySelector('.splash-logo') : null;
    const greetEl = document.getElementById('splash-greeting');
    const fillEl = document.getElementById('splash-progress-fill');
    if(!overlay || !greetEl || !fillEl){ resolve(); return; }
    const name = (state.profile && state.profile.name) ? state.profile.name.trim() : '';
    greetEl.textContent = name ? `Hola, ${name}, bienvenido` : 'Hola, bienvenido';
    logoEl.classList.remove('show');
    greetEl.classList.remove('show');
    fillEl.style.transition = 'none';
    fillEl.style.width = '0%';
    overlay.classList.remove('fade-out');
    overlay.classList.remove('hide');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      logoEl.classList.add('show');
      greetEl.classList.add('show');
      fillEl.style.transition = 'width 2.5s linear';
      fillEl.style.width = '100%';
    }));
    setTimeout(() => {
      overlay.classList.add('fade-out');
      setTimeout(() => { overlay.classList.add('hide'); resolve(); }, 250);
    }, 2500);
  });
}

// ======================================================================
// LICENCIA PRO — atada a tu email de Google, sin necesidad de servidor.
// El código de licencia se calcula con una firma (HMAC) a partir de tu
// email + esta clave. Solo funciona en un dispositivo nuevo si inicias
// sesión con la MISMA cuenta de Google y pegas tu código — así no es
// transferible a otra persona, pero tú puedes cambiar de móvil sin pagar
// otra vez. Ya lleva una clave aleatoria puesta, no hace falta que la toques.
// ======================================================================
const LICENSE_SECRET = '079fc7d2b1503a17e4aef1dc32b0d0a9b869d01bc1acec67df5bca402095b5d5';

async function computeLicenseSig(email){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(LICENSE_SECRET), { name:'HMAC', hash:'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(email.trim().toLowerCase()));
  return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 16);
}
async function generateLicenseCode(email){
  const sig = await computeLicenseSig(email);
  const encodedEmail = btoa(email.trim().toLowerCase()).replace(/=+$/,'');
  return `${encodedEmail}.${sig}`;
}
async function verifyLicenseCode(code, email){
  try{
    const [encodedEmail, sig] = (code || '').trim().split('.');
    if(!encodedEmail || !sig) return false;
    const expectedEncoded = btoa(email.trim().toLowerCase()).replace(/=+$/,'');
    if(encodedEmail !== expectedEncoded) return false;
    const expectedSig = await computeLicenseSig(email);
    return sig === expectedSig;
  }catch(e){ return false; }
}
async function ensureLicenseCode(){
  if(state.profile && state.profile.isPro && state.profile.email && !state.profile.licenseCode){
    state.profile.licenseCode = await generateLicenseCode(state.profile.email);
    await safeSet('profile', state.profile);
  }
}

function calcTargets(p){
  if(!p) return null;
  const actMap = { sedentary:1.2, light:1.375, moderate:1.55, active:1.725, veryActive:1.9 };
  const bmr = p.sex === 'male'
    ? 10*p.currentWeight + 6.25*p.heightCm - 5*p.age + 5
    : 10*p.currentWeight + 6.25*p.heightCm - 5*p.age - 161;
  const tdee = bmr * (actMap[p.activityLevel] || 1.375);
  const diff = p.goalWeight - p.currentWeight;

  // goalType: 'auto' infers from current vs goal weight; otherwise it's explicit
  let goalType = p.goalType || 'auto';
  let direction = goalType;
  if(goalType === 'auto'){
    direction = diff < -0.1 ? 'deficit' : (diff > 0.1 ? 'surplus' : 'maintain');
  }

  const adjustment = (p.paceKgWeek || 0.5) * 1100;
  let autoCalorieTarget = tdee;
  if(direction === 'deficit') autoCalorieTarget = tdee - adjustment;
  else if(direction === 'surplus') autoCalorieTarget = tdee + adjustment;
  autoCalorieTarget = Math.max(1200, Math.round(autoCalorieTarget));

  const autoProteinG = round1(1.8 * p.currentWeight);
  const autoProteinCal = autoProteinG * 4;
  const autoRemaining = Math.max(0, autoCalorieTarget - autoProteinCal);
  const autoCarbG = round1((autoRemaining * 0.55) / 4);
  const autoFatG = round1((autoRemaining * 0.45) / 9);

  const isCustom = !!p.customMode;
  const calorieTarget = (isCustom && p.customCalories) ? Math.round(p.customCalories) : autoCalorieTarget;
  const proteinG = (isCustom && p.customProtein != null) ? round1(p.customProtein) : autoProteinG;
  const carbG = (isCustom && p.customCarb != null) ? round1(p.customCarb) : autoCarbG;
  const fatG = (isCustom && p.customFat != null) ? round1(p.customFat) : autoFatG;

  // El objetivo de kcal a quemar con ejercicio tiene que tener sentido
  // según el objetivo: en déficit ayuda a crear más margen; en superávit
  // (ganar músculo/peso) pedir que quemes mucho va CONTRA el propio
  // objetivo, así que baja bastante en vez de quedarse fijo siempre en lo mismo.
  const autoBurnGoal = direction === 'deficit' ? 300 : (direction === 'maintain' ? 200 : 100);
  const burnGoal = (isCustom && p.customBurnGoal != null) ? Math.round(p.customBurnGoal) : autoBurnGoal;

  return {
    bmr: Math.round(bmr), tdee: Math.round(tdee), calorieTarget,
    proteinG, carbG, fatG, burnGoal, autoBurnGoal,
    direction, goalType, isCustom,
    autoCalorieTarget, autoProteinG, autoCarbG, autoFatG,
    weeksToGoal: diff !== 0 ? Math.abs(diff / (p.paceKgWeek || 0.5)).toFixed(1) : '0'
  };
}

// SELECTOR DE NÚMEROS TIPO RUEDA (como los relojes de alarma de iPhone).
// Reutilizable en cualquier campo numérico de la app.
// ======================================================================
const WHEEL_ITEM_H = 42;
let wheelValues = {};
let wheelTimers = {};

function wheelRange(min, max, step){
  const arr = [];
  const n = Math.round((max - min) / step);
  for(let i = 0; i <= n; i++) arr.push(+(min + i*step).toFixed(2));
  return arr;
}

function buildWheelHTML(id, min, max, step, unit){
  const values = wheelRange(min, max, step);
  const itemsHtml = values.map(v => `<div class="wheel-item" data-value="${v}">${v}${unit ? ' '+unit : ''}</div>`).join('');
  return `
    <div class="wheel-picker">
      <div class="wheel-track" id="${id}">
        <div class="wheel-pad"></div>
        ${itemsHtml}
        <div class="wheel-pad"></div>
      </div>
      <div class="wheel-highlight"></div>
    </div>`;
}

function initWheelPicker(id, initialValue){
  const track = document.getElementById(id);
  if(!track) return;
  const items = Array.from(track.querySelectorAll('.wheel-item'));
  let idx = items.findIndex(it => Math.abs(parseFloat(it.dataset.value) - initialValue) < 1e-6);
  if(idx < 0) idx = Math.round(items.length / 2);
  track.scrollTop = idx * WHEEL_ITEM_H;
  updateWheelSelection(id);
  track.addEventListener('scroll', () => {
    clearTimeout(wheelTimers[id]);
    wheelTimers[id] = setTimeout(() => updateWheelSelection(id), 90);
  });
}

function updateWheelSelection(id){
  const track = document.getElementById(id);
  if(!track) return;
  const items = track.querySelectorAll('.wheel-item');
  const idx = Math.max(0, Math.min(items.length - 1, Math.round(track.scrollTop / WHEEL_ITEM_H)));
  items.forEach(it => it.classList.remove('selected'));
  if(items[idx]){
    items[idx].classList.add('selected');
    wheelValues[id] = parseFloat(items[idx].dataset.value);
  }
}

function getWheelValue(id, fallback){
  return wheelValues[id] != null ? wheelValues[id] : fallback;
}

function obSaveCurrentStepInputs(){

// Sugiere un nivel de actividad de partida según el trabajo y el
// deporte que ha contado el usuario — luego lo puede cambiar a mano
// en el desplegable si no encaja.
function suggestActivityLevel(jobType, sport){
  let score = 1; // 0=sedentary 1=light 2=moderate 3=active 4=veryActive
  if(jobType === 'Trabajo físico / manual') score += 1;
  if(jobType === 'Trabajo de pie') score += 0.5;
  if(jobType === 'Trabajo de oficina (sentado)') score -= 0.5;
  if(sport === 'Pesas / gimnasio' || sport === 'Running o cardio') score += 1;
  if(sport === 'Deportes de equipo') score += 1.5;
  if(sport === 'Yoga o pilates') score += 0.5;
  score = Math.max(0, Math.min(4, Math.round(score)));
  return ['sedentary','light','moderate','active','veryActive'][score];
}

function whenGoogleReady(renderFn, attemptsLeft){
  attemptsLeft = attemptsLeft == null ? 24 : attemptsLeft;
  if(window.google && window.google.accounts && window.google.accounts.id){
    try{ renderFn(); }catch(e){ console.warn('Google sign-in render failed', e); }
    return;
  }
  if(attemptsLeft <= 0){
    console.warn('Google Identity Services no llegó a cargar a tiempo');
    return;
  }
  setTimeout(() => whenGoogleReady(renderFn, attemptsLeft - 1), 250);
}

    if(container){
      container.innerHTML = '';
      google.accounts.id.renderButton(container, { theme: 'outline', size: 'large', width: 280, text: 'continue_with', locale: 'es' });
    }
  });
}

function decodeJwt(token){
  const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  const json = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  return JSON.parse(json);
}

async function handleGoogleCredential(response){
  try{
    googleIdToken = response.credential;
    const payload = decodeJwt(response.credential);
    obDraft.name = payload.name || obDraft.name;
    obDraft.googleAvatarUrl = payload.picture || null;
    obDraft.email = payload.email || null;
    showToast('Hola, ' + (payload.given_name || payload.name || '') + ' 👋');
    renderOnboardStep();
    if(SYNC_ENDPOINT){
      const cloud = await pullFromCloud();
      if(cloud && cloud.data && cloud.data.profile){
        openActionOverlay(`
          <h1 style="margin:0 0 10px 0;">☁️ Ya tienes una cuenta</h1>
          <p class="sub" style="margin:0 0 20px 0;">Encontramos datos guardados con esta cuenta de Google. ¿Recuperamos tu cuenta en vez de crear una nueva?</p>
          <button class="btn accent" onclick="restoreFromCloudDuringOnboarding()">Recuperar mi cuenta</button>
          <button class="btn ghost small" style="margin-top:10px;" onclick="closeActionOverlay()">No, seguir creando una nueva</button>
        `);
      }
    }
  }catch(e){
    console.error('google credential decode failed', e);
  }
}

async function restoreFromCloudDuringOnboarding(){
  const cloud = await pullFromCloud();
  closeActionOverlay();
  if(!cloud || !cloud.data){ showToast('No se pudo recuperar la cuenta', true); return; }
  await applyAllLocalData(cloud.data);
  document.getElementById('onboard').classList.add('hide');
  const log = await safeGet(logKey());
  state.log = log || { foods: [], exercises: [] };
  const w = await safeGet('weights');
  state.weights = w || [];
  state.logDates = (await safeGet('logDates')) || [];
  state.daySummaries = await loadDaySummaries();
  state.supplements = (await safeGet('supplements')) || [];
  if(state.profile.theme) applyTheme(state.profile.theme);
  applyDarkMode(state.profile.darkMode);
  renderAll();
  showToast('¡Cuenta recuperada! 🎉');
}

async function handleGoogleCredentialProfile(response){
  try{
    googleIdToken = response.credential;
    const payload = decodeJwt(response.credential);
    state.profile.name = payload.name || state.profile.name;
    state.profile.email = payload.email || state.profile.email;
    if(payload.picture){
      try{ state.profile.avatar = await fetchImageAsDataUrl(payload.picture, 200, 0.8); }
      catch(e){ /* si falla la foto, seguimos solo con el nombre */ }
    }
    await safeSet('profile', state.profile);
    await ensureLicenseCode();
    let justActivatedPro = false;
    if(!state.profile.isPro && state.profile.email){
      const verified = await checkProStatus(state.profile.email);
      if(verified){
        state.profile.isPro = true;
        await safeSet('profile', state.profile);
        await ensureLicenseCode();
        justActivatedPro = true;
      }
    }
    window.__pendingProCheck = false;
    showToast(justActivatedPro ? '¡eatiseasy Pro activado! 🎉' : ('Sesión iniciada con Google, ' + (payload.given_name || payload.name || '')));
    renderAll();
    await checkCloudAfterSignIn();
  }catch(e){
    console.error('google credential (perfil) decode failed', e);
    showToast('No se pudo iniciar sesión con Google', true);
  }
}

function fetchImageAsDataUrl(url, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { try{ resolve(resizeToDataUrl(img, maxDim, quality)); }catch(e){ reject(e); } };
    img.onerror = reject;
    img.src = url;
  });
}

// Mensaje final personalizado, realista según tu ritmo y tus respuestas
// — no genérico, intenta enganchar con algo concreto de lo que dijiste.
function buildMotivationalMessage(p, t){
  const parts = [];
  if(t.direction === 'deficit'){
    parts.push(`A este ritmo, deberías empezar a notar progreso real en unas ${t.weeksToGoal} semanas — sin prisas, de forma sostenible.`);
  } else if(t.direction === 'surplus'){
    parts.push(`Ganar peso de forma sana lleva su tiempo — con este plan, en unas ${t.weeksToGoal} semanas deberías empezar a verlo.`);
  } else {
    parts.push('Mantener tu peso actual con estos números te va a ayudar a estabilizar tus hábitos.');
  }
  const obstacleTips = {
    'Falta de tiempo': 'Como vas justo de tiempo, hacer una foto rápida a tu comida te va a ahorrar minutos cada día.',
    'No sé qué comer': 'Como no siempre sabes qué comer, el buscador de alimentos te puede dar ideas rápidas cuando lo necesites.',
    'Se me olvida registrar': 'Para que no se te olvide registrar, activa los recordatorios en tu perfil.',
    'Antojos y picoteo': 'Los antojos son normales — registra también los picoteos, así el plan sigue siendo realista.',
    'Falta de motivación': 'Llevar la cuenta de tus días seguidos puede ayudarte a mantener la motivación día a día.'
  };
  const obstacle = (p.obstacles || [])[0];
  if(obstacle && obstacleTips[obstacle]) parts.push(obstacleTips[obstacle]);
  const goal = (p.goalsWanted || [])[0];
  if(goal) parts.push(`Vas camino de "${goal.toLowerCase()}" — un paso cada día.`);
  return parts.join(' ');
}

      <button class="btn accent" onclick="showProPaywall(true)">Empezar</button>
    </div>
  `;
  animateCountUp('reveal-cal-num', t.calorieTarget);
}

function animateCountUp(elId, target, duration){
  duration = duration || 1100;
  const el = document.getElementById(elId);
  if(!el) return;
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * eased);
    if(p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function thinBar(label, value, target, color, unit, icon){
  const pct = target > 0 ? Math.min(100, Math.round((value/target)*100)) : 0;
  const over = value > target;
  return `
    <div class="bar-block">
      <div class="bar-top"><span class="lbl">${icon ? icon + ' ' : ''}${label}</span><span class="val">${Math.round(value)} / ${Math.round(target)} ${unit}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${over ? 'var(--warn)' : color};"></div></div>
    </div>`;
}

function ringSvg(net, target, mini){
  const R=80, C=2*Math.PI*R;
  const over = net > target;
  const pct = target>0 ? Math.min(100, (net/target)*100) : 0;
  const offset = C - (pct/100)*C;
  const color = over ? 'var(--warn)' : 'var(--accent)';
  const remain = Math.abs(Math.round(target - net));
  if(mini){
    return `
      <svg class="ring ring-mini" viewBox="0 0 200 200">
        <circle class="ring-track" cx="100" cy="100" r="${R}" stroke-width="16"></circle>
        <circle class="ring-fill" cx="100" cy="100" r="${R}" stroke="${color}" stroke-width="16"
          stroke-dasharray="${C}" stroke-dashoffset="${offset}" transform="rotate(-90 100 100)"></circle>
        <text x="100" y="112" class="ring-num-mini" fill="${color}">${remain}</text>
      </svg>`;
  }
  const label = over ? tr('kcal_excess') : tr('kcal_left');
  return `
    <svg class="ring" viewBox="0 0 200 200">
      <circle class="ring-track" cx="100" cy="100" r="${R}"></circle>
      <circle class="ring-fill" cx="100" cy="100" r="${R}" stroke="${color}"
        stroke-dasharray="${C}" stroke-dashoffset="${offset}" transform="rotate(-90 100 100)"></circle>
      <text x="100" y="96" class="ring-num" fill="${color}">${remain}</text>
      <text x="100" y="120" class="ring-label">${label}</text>
    </svg>`;
}

function macroRingSvg(value, target, color, iconMarkup){
  const R=80, C=2*Math.PI*R;
  const pct = target > 0 ? Math.min(100, (value/target)*100) : 0;
  const offset = C - (pct/100)*C;
  return `
    <svg class="macro-ring" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--line-strong)" stroke-width="16"></circle>
      <circle cx="100" cy="100" r="${R}" fill="none" stroke="${color}" stroke-width="16" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${offset}" transform="rotate(-90 100 100)"></circle>
      <foreignObject x="62" y="62" width="76" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:${color};font-size:36px;">${iconMarkup}</div></foreignObject>
    </svg>`;
}

function weekdayLetterEs(dayIndex){
  // dayIndex: 0=Sunday ... 6=Saturday
  return ['D','L','M','X','J','V','S'][dayIndex];
}

function renderWeekStrip(){
  const today = new Date();
  today.setHours(0,0,0,0);

  // Desde el primer domingo que incluye tu fecha de alta (o hace 84 días
  // si no hay fecha, por si acaso) hasta hoy — así puedes deslizar hacia
  // atrás y ver cualquier día desde que empezaste a usar la app.
  let start = state.profile.createdAt ? new Date(state.profile.createdAt) : new Date(today);
  start.setHours(0,0,0,0);
  if(isNaN(start.getTime()) || start > today) start = new Date(today);
  start.setDate(start.getDate() - start.getDay());

  // Un poco de aire extra a cada lado (5 días vacíos antes y después),
  // solo por estética, para que no se vea tan vacío al principio.
  start.setDate(start.getDate() - 5);
  const end = new Date(today);
  end.setDate(end.getDate() + 5);

  let cells = '';
  const d = new Date(start);
  while(d <= end){
    const dStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const isToday = dStr === todayStr();
    const isPast = d < today;
    const clickable = isToday || (isPast && state.logDates.includes(dStr));
    cells += `
      <div class="week-cell ${isToday ? 'is-today' : ''} ${clickable ? '' : 'is-disabled'}" ${isToday ? 'id="week-cell-today"' : ''} ${clickable ? `onclick="openDayDetail('${dStr}')"` : ''}>
        <span class="week-letter">${weekdayLetterEs(d.getDay())}</span>
        <span class="week-num">${d.getDate()}</span>
      </div>`;
    d.setDate(d.getDate()+1);
  }
  setTimeout(() => {
    const todayCell = document.getElementById('week-cell-today');
    if(todayCell) todayCell.scrollIntoView({ behavior:'instant', inline:'end', block:'nearest' });
  }, 0);
  return `<div class="week-strip">${cells}</div>`;
}

const ANALYZING_MESSAGES = ['Analizando macronutrientes…', 'Analizando ingredientes…', 'Registrando comida…'];
let analyzingProgress = 0;
let analyzingMsgIndex = 0;
let analyzingTickTimer = null;
let analyzingMsgTimer = null;

function startAnalyzingAnimation(){
  analyzingProgress = 0;
  analyzingMsgIndex = 0;
  clearInterval(analyzingTickTimer);
  clearInterval(analyzingMsgTimer);
  updateAnalyzingUI();
  analyzingTickTimer = setInterval(() => {
    if(analyzingProgress < 92){
      analyzingProgress += Math.max(0.6, (92 - analyzingProgress) * 0.06);
      updateAnalyzingUI();
    }
  }, 90);
  analyzingMsgTimer = setInterval(() => {
    analyzingMsgIndex = (analyzingMsgIndex + 1) % ANALYZING_MESSAGES.length;
    updateAnalyzingUI();
  }, 1100);
}
function stopAnalyzingAnimation(){
  clearInterval(analyzingTickTimer);
  clearInterval(analyzingMsgTimer);
  analyzingTickTimer = null;
  analyzingMsgTimer = null;
  analyzingProgress = 100;
}
function updateAnalyzingUI(){
  const pctEl = document.getElementById('analyzing-pct');
  const msgEl = document.getElementById('analyzing-msg');
  const ringEl = document.getElementById('analyzing-ring-fill');
  if(pctEl) pctEl.textContent = Math.round(analyzingProgress) + '%';
  if(msgEl) msgEl.textContent = ANALYZING_MESSAGES[analyzingMsgIndex];
  if(ringEl){
    const circumference = 2 * Math.PI * 54;
    ringEl.style.strokeDashoffset = circumference * (1 - analyzingProgress/100);
  }
}

function renderAnalyzingOverlay(){
  const circumference = 2 * Math.PI * 54;
  return `
    <div class="analyzing-overlay">
      <svg class="analyzing-ring" viewBox="0 0 120 120">

        <circle id="analyzing-ring-fill" cx="60" cy="60" r="54" fill="none" stroke-width="8"

function renderToday(){
  const t = calcTargets(state.profile);

  const burned = state.log.exercises.reduce((s,e)=>s+e.cal,0);

  const carbs = state.log.foods.reduce((s,f)=>s+f.carb,0);
  const fat = state.log.foods.reduce((s,f)=>s+f.fat,0);

  const remain = Math.max(0, Math.round(t.calorieTarget - consumed));
  const proteinLeft = Math.max(0, round1(t.proteinG - protein));
  const carbsLeft = Math.max(0, round1(t.carbG - carbs));
  const fatLeft = Math.max(0, round1(t.fatG - fat));

  const foodItems = state.log.foods.map(f => ({ ...f, kind:'food' }));
  const exItems = state.log.exercises.map(e => ({ ...e, kind:'exercise' }));
  const loggedItems = [...foodItems, ...exItems].sort((a,b) => new Date(b.time) - new Date(a.time));

  const logRows = loggedItems.length
    ? loggedItems.map(item => {
        const timeLabel = new Date(item.time).toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });

              </div>

        }

            <div class="log-body">
              <div class="log-top"><div class="log-title">${item.name}</div><div class="log-time">${timeLabel}</div><span class="del" onclick="event.stopPropagation(); removeFood('${item.id}')">✕</span></div>
              <div class="log-cal">${ICON.fire} <b>${item.cal}</b> calorías</div>
              <div class="log-macros">
                <span>🍗 ${Math.round(item.protein)}g</span>
                <span>${ICON.carbs} ${Math.round(item.carb)}g</span>
                <span>${ICON.water} ${Math.round(item.fat)}g</span>

            </div>

      }).join('')
    : `<div class="empty">Nada registrado aún hoy</div>`;

  const suppRows = state.supplements.map(s=>{
    const count = state.takenToday[s.id] || 0;
    if(s.type === 'water'){
      const target = s.target || 8;
      const mlPerGlass = s.mlPerGlass || 300;
      const done = count >= target;

      const mlTarget = target * mlPerGlass;
      return `<div class="reminder-row">
        <div class="reminder-top">
          <span class="rname">${ICON.water} <b>${s.name}</b> — ${formatMl(mlDrunk)}/${formatMl(mlTarget)}${done ? ' ✓' : ''}</span>

              <button class="water-step-btn" onclick="incrementWater('${s.id}')" aria-label="Añadir uno">+</button>
            </div>
          </div>
        </div>
        <div class="water-track"><div class="water-fill ${done ? 'is-done' : ''}" style="width:${pct}%;"></div></div>

function openHealthScoreInfo(hs){

    desc = 'Buena señal: parece tener ingredientes poco procesados, con un equilibrio razonable entre proteína, grasas y carbohidratos, sin excesos evidentes de azúcar o grasas poco saludables.';
  } else if(hs >= 6){
    tier = 'Bastante equilibrada';
    desc = 'En general está bien, aunque puede tener algo de más de un nutriente concreto (grasa, azúcar o sal) o ingredientes algo procesados sin llegar a ser un problema.';
  } else if(hs >= 4){
    tier = 'Mejorable';
    desc = 'Puede tener bastante grasa, azúcar o sal, ingredientes muy procesados, o poca variedad nutricional — no pasa nada por comerla, pero no la conviertas en la base de tu día a día.';
  } else {
    tier = 'Poco saludable';
    desc = 'Suele indicar alta densidad calórica con poco valor nutricional — mucha grasa, azúcar o ultraprocesado. Está bien de vez en cuando, mejor no a diario.';
  }
  openActionOverlay(`

  const newServings = parseFloat(document.getElementById('servings-input').value) || 1;
  const oldServings = f.servings || 1;

    summaries.push({ date: d, consumed });

function switchCameraMode(mode){
  cameraMode = mode;
  const tabPhoto = document.getElementById('cam-tab-photo');
  const tabBarcode = document.getElementById('cam-tab-barcode');
  if(tabPhoto) tabPhoto.classList.toggle('active', mode === 'photo');
  if(tabBarcode) tabBarcode.classList.toggle('active', mode === 'barcode');
  const statusEl = document.getElementById('camera-status');
  if(statusEl) statusEl.textContent = '';
  if(mode === 'barcode') startBarcodeDetection();
  else stopBarcodeDetection();
}

function cameraShutterAction(){
  if(cameraMode === 'photo') captureCameraPhoto();
  // en modo código de barras la lectura ya es automática; el botón solo confirma que sigue buscando
  else{
    const statusEl = document.getElementById('camera-status');
    if(statusEl && !statusEl.textContent.includes('Buscando producto')) statusEl.textContent = 'Buscando código…';
  }
}

function captureCameraPhoto(){
  const video = document.getElementById('camera-video');
  if(!video || !video.videoWidth) return;
  const MAX_SIDE = 1600; // tope solo para la foto que se envía a analizar, no afecta a la vista en directo
  let w = video.videoWidth, h = video.videoHeight;
  if(Math.max(w,h) > MAX_SIDE){
    const scale = MAX_SIDE / Math.max(w,h);
    w = Math.round(w * scale); h = Math.round(h * scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(video, 0, 0, w, h);
  canvas.toBlob(async (blob) => {
    closeActionOverlay();
    await processFoodImage(blob);
  }, 'image/jpeg', 0.85);
}

function onGalleryPhotoChosen(evt){
  const file = evt.target.files[0];
  evt.target.value = '';
  if(!file) return;
  closeActionOverlay();
  processFoodImage(file);
}

function loadScriptOnce(src){
  return new Promise((resolve, reject) => {
    if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('no se pudo cargar (revisa tu conexión)'));
    document.head.appendChild(s);
  });
}

// Escanea códigos de barras sobre la MISMA cámara que ya tenemos abierta,
// tomando fotogramas sueltos y pasándoselos a la librería para decodificar
// — más fiable que dejar que la librería intente controlar la cámara ella
// sola, y con mensajes de estado claros en cada paso para saber qué falla.
async function startBarcodeDetection(){
  stopBarcodeDetection();
  const statusEl = document.getElementById('camera-status');
  const video = document.getElementById('camera-video');
  if(!video) return;
  if(statusEl) statusEl.textContent = 'Cargando lector de códigos…';
  try{
    await loadScriptOnce('https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js');
  }catch(e){
    if(statusEl) statusEl.textContent = 'No se pudo cargar el lector: ' + e.message;
    return;
  }
  if(typeof Html5Qrcode === 'undefined' || typeof Html5QrcodeSupportedFormats === 'undefined'){
    if(statusEl) statusEl.textContent = 'El lector de códigos no se cargó correctamente.';
    return;
  }
  if(statusEl) statusEl.textContent = 'Buscando código…';
  const formats = [
    Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.QR_CODE
  ];
  let scanner;
  try{
    scanner = new Html5Qrcode('barcode-scan-target', { formatsToSupport: formats, verbose: false });
  }catch(e){
    if(statusEl) statusEl.textContent = 'No se pudo iniciar el lector: ' + e.message;
    return;
  }
  const canvas = document.createElement('canvas');
  barcodeScanTimer = setInterval(async () => {
    if(!video.videoWidth) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    canvas.toBlob(async (blob) => {
      if(!blob || cameraMode !== 'barcode') return;
      try{
        const file = new File([blob], 'frame.jpg', { type: 'image/jpeg' });
        const decodedText = await scanner.scanFile(file, false);
        stopBarcodeDetection();
        await lookupBarcodeProduct(decodedText);
      }catch(e){ /* este fotograma no tenía ningún código legible, seguimos */ }
    }, 'image/jpeg', 0.85);
  }, 700);
}

function stopBarcodeDetection(){
  if(barcodeScanTimer){ clearInterval(barcodeScanTimer); barcodeScanTimer = null; }
}

async function lookupBarcodeProduct(barcode){
  const statusEl = document.getElementById('camera-status');
  if(statusEl) statusEl.textContent = 'Buscando producto…';
  try{
    const resp = await withTimeout(
      fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`),
      10000, 'La búsqueda ha tardado demasiado'
    );
    const data = await resp.json();
    if(!data.product) throw new Error('Producto no encontrado');
    const p = data.product;
    const n = p.nutriments || {};
    const name = (p.product_name || p.generic_name || 'Producto escaneado') + ' (100 g)';
    const cal = Math.round(n['energy-kcal_100g'] || 0);
    const protein = round1(n['proteins_100g'] || 0);
    const carb = round1(n['carbohydrates_100g'] || 0);
    const fat = round1(n['fat_100g'] || 0);
    closeActionOverlay();
    const newId = await addFoodEntry({ name, cal, protein, carb, fat, source:'barcode', servings:1 });
    openFoodDetail(newId);
  }catch(e){
    if(statusEl) statusEl.textContent = 'No se encontró ese producto — añádelo a mano.';
    setTimeout(() => { if(cameraMode === 'barcode') startBarcodeDetection(); }, 2000);
  }
}

function resizeToDataUrl(img, maxDim, quality){
  let { width, height } = img;
  if(width > maxDim || height > maxDim){
    if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
    else { width = Math.round(width * (maxDim/height)); height = maxDim; }
  }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  canvas.getContext('2d').drawImage(img, 0, 0, width, height);
  return canvas.toDataURL('image/jpeg', quality);
}

function fileToCompressedBase64(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      try{
        const analysisUrl = resizeToDataUrl(img, 1024, 0.8);
        const thumbnail = resizeToDataUrl(img, 900, 0.85);
        resolve({ base64: analysisUrl.split(',')[1], mediaType: 'image/jpeg', thumbnail });
      }catch(e){ reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('No se pudo procesar la imagen')); };
    img.src = objectUrl;
  });
}

function withTimeout(promise, ms, message){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(message || 'Tiempo de espera agotado')), ms))
  ]);
}

async function callGeminiWithFallback(baseUrlNoKey, apiKey, requestBody){
  // Try method 1: key as URL query param (Google's documented browser method)
  try{
    const resp1 = await fetch(`${baseUrlNoKey}?key=${encodeURIComponent(apiKey)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(requestBody)
    });
    if(resp1.ok) return resp1;
    if(resp1.status !== 401 && resp1.status !== 403) return resp1; // different error, don't retry
  }catch(e){ /* network error, fall through to try method 2 */ }

  // Try method 2: key as x-goog-api-key header
  return fetch(baseUrlNoKey, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
    body: JSON.stringify(requestBody)
  });
}

async function analyzeFoodImage(base64, mediaType, correctionNote){
  const { url, headers, mode, provider, apiKey } = await getPhotoEndpoint();
  const basePrompt = 'Analiza esta foto de comida y estima sus valores nutricionales para la porción mostrada.';
  const correctionPart = correctionNote
    ? ` Esta foto ya se había analizado antes y el usuario dice que el resultado estaba mal, con esta corrección: "${correctionNote}". Ten en cuenta esa corrección y vuelve a estimarlo bien.`
    : '';
  const schemaPart = ' Si algún ingrediente es líquido (leche, batido, zumo, sopa, caldo...), estima también sus gramos aproximados (aplica que 1 ml equivale a 1 gramo); no pongas nunca 0, da siempre tu mejor estimación aproximada. Responde ÚNICAMENTE con un objeto JSON válido, sin texto adicional, sin backticks, exactamente con este formato: {"name":"nombre breve del plato en español","calories":numero_entero,"protein_g":numero_entero,"carbs_g":numero_entero,"fat_g":numero_entero,"health_score":numero_entero_del_1_al_10_donde_10_es_muy_saludable,"ingredients":[{"name":"ingrediente en español","grams":numero_entero_aproximado}]} (la lista de ingredients debe tener como máximo 6 elementos, con una estimación aproximada de gramos para cada uno, incluidos los líquidos).';
  const prompt = basePrompt + correctionPart + schemaPart;

  const requestBody = provider === 'gemini'
    ? {
        contents: [{
          parts: [
            { inline_data: { mime_type: mediaType, data: base64 } },
            { text: prompt }
          ]
        }]
      }
    : {
        model: 'claude-sonnet-4-6',
        max_tokens: 500,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
            { type: 'text', text: prompt }
          ]
        }]
      };

  const resp = (provider === 'gemini' && apiKey)
    ? await callGeminiWithFallback(url, apiKey, requestBody)
    : await fetch(url, { method: 'POST', headers, body: JSON.stringify(requestBody) });

  if(!resp.ok){
    const errBody = await resp.text();
    if((resp.status === 401 || resp.status === 403) && mode === 'claude'){
      throw new Error('Esta función solo funciona dentro del chat de Claude, o configurando un proxy/clave gratis de Gemini en Perfil.');
    }
    if((resp.status === 401 || resp.status === 403) && provider === 'gemini'){
      throw new Error('Google rechazó la clave (código ' + resp.status + '). Revisa que la API "Generative Language API" esté activada en tu proyecto de Google Cloud, o crea una clave nueva en aistudio.google.com.');
    }
    throw new Error('HTTP ' + resp.status + ': ' + errBody.slice(0,150));
  }
  const data = await resp.json();
  if(data.error){ throw new Error(data.error.message || 'Error de la API'); }

  const text = provider === 'gemini'
    ? ((data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts || []).map(p=>p.text||'').join('').trim())
    : ((data.content || []).map(b=>b.text || '').join('').trim());
  if(!text) throw new Error('Respuesta vacía del modelo');
  const clean = text.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(clean);
  return {
    name: parsed.name || 'Comida',
    cal: Math.round(parsed.calories) || 0,
    protein: round1(parsed.protein_g) || 0,
    carb: round1(parsed.carbs_g) || 0,
    fat: round1(parsed.fat_g) || 0,
    healthScore: parsed.health_score != null ? Math.max(1, Math.min(10, Math.round(parsed.health_score))) : null,
    ingredients: normalizeIngredients(parsed.ingredients)
  };
}

// Admite tanto el formato nuevo ({name, grams}) como el viejo (solo texto),
// para no romper comidas guardadas antes de este cambio.
function normalizeIngredients(list){
  if(!Array.isArray(list)) return [];
  return list.slice(0, 8).map(item => {
    if(typeof item === 'string') return { name: item, grams: null };
    return { name: item.name || String(item), grams: item.grams != null ? Math.round(item.grams) : null };
  });
}

    `<span class="ingredient-chip">${ing.name}${ing.grams ? ` · ${ing.grams} g` : ''}</span>`
  ).join('')}</div>`;
}

  const { url, headers, mode, provider, apiKey } = await getPhotoEndpoint();

  const requestBody = provider === 'gemini'
    ? { contents: [{ parts: [ { inline_data: { mime_type: 'image/jpeg', data: base64 } }, { text: prompt } ] }] }
    : { model: 'claude-sonnet-4-6', max_tokens: 100, messages: [{ role:'user', content: [ { type:'image', source:{ type:'base64', media_type:'image/jpeg', data: base64 } }, { type:'text', text: prompt } ] }] };
  const resp = (provider === 'gemini' && apiKey)
    ? await callGeminiWithFallback(url, apiKey, requestBody)
    : await fetch(url, { method:'POST', headers, body: JSON.stringify(requestBody) });
  if(!resp.ok) throw new Error('No se pudo estimar la cantidad');
  const data = await resp.json();
  if(data.error) throw new Error(data.error.message || 'Error de la API');
  const text = provider === 'gemini'
    ? ((data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts || []).map(p=>p.text||'').join('').trim())
    : ((data.content || []).map(b=>b.text || '').join('').trim());
  const clean = text.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(clean);
  return Math.round(parsed.grams) || 0;
}

async function processFoodImage(file){
  if(!file || !file.type || !file.type.startsWith('image/')){
    showToast('Elige un archivo de imagen', true);
    return;
  }
  state.analyzing = true;
  setTab('today');
  startAnalyzingAnimation();
  let succeeded = false;
  try{
    const { base64, mediaType, thumbnail } = await withTimeout(
      fileToCompressedBase64(file), 12000, 'La imagen ha tardado demasiado en procesarse'
    );
    const result = await withTimeout(
      analyzeFoodImage(base64, mediaType), 20000, 'El análisis ha tardado demasiado, inténtalo de nuevo'
    );
    state.pendingFood = { ...result, photo: thumbnail };
    succeeded = true;
  }catch(e){
    console.error('analyze photo failed:', e);
    showToast('No se pudo analizar la foto: ' + e.message, true);
  }finally{
    stopAnalyzingAnimation();
    state.analyzing = false;
    renderAll();
  }
  if(succeeded) openPendingFoodDetail();
}

async function useSavedMeal(id){
  const saved = (await safeGet('savedMeals')) || [];
  const s = saved.find(x => x.id === id);
  if(!s) return;
  closeActionOverlay();
  const newId = await addFoodEntry({
    name: s.name, cal: s.cal, protein: s.protein, carb: s.carb, fat: s.fat,
    photo: s.photo, healthScore: s.healthScore, ingredients: s.ingredients, source: 'saved', servings: 1
  });
  openFoodDetail(newId);
}

async function removeSavedMeal(id){
  let saved = (await safeGet('savedMeals')) || [];
  const removed = saved.find(x => x.id === id);
  saved = saved.filter(x => x.id !== id);
  await safeSet('savedMeals', saved);

  if(removed && removed.sourceFoodId && removed.sourceDate){
    if(removed.sourceDate === todayStr()){
      const f = state.log.foods.find(x => x.id === removed.sourceFoodId);
      if(f){ f.savedAsTemplate = false; await saveLog(); }
    } else {
      const log = await safeGet('log:' + removed.sourceDate);
      if(log){
        const idx = log.foods.findIndex(x => x.id === removed.sourceFoodId);
        if(idx >= 0){ log.foods[idx].savedAsTemplate = false; await safeSet('log:' + removed.sourceDate, log); }
      }
    }
  }
  openSavedMeals();
}

function getCurrentWeekDates(){
  return getWeekDatesFor(todayStr());
}
function getWeekDatesFor(anchorDateStr){
  // Lunes a domingo de la semana que contiene anchorDateStr
  const anchor = new Date(anchorDateStr + 'T00:00:00');
  const dow = anchor.getDay(); // 0=domingo ... 6=sábado
  const mondayOffset = (dow === 0) ? -6 : (1 - dow);
  const monday = new Date(anchor);
  monday.setDate(anchor.getDate() + mondayOffset);
  const dates = [];
  for(let i = 0; i < 7; i++){
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'));
  }
  return dates;
}
function listPastWeeks(){
  // Lunes de cada semana anterior a la actual, desde tu fecha de alta
  const weeks = [];
  const created = state.profile.createdAt ? new Date(state.profile.createdAt) : null;
  const currentMonday = new Date(getCurrentWeekDates()[0] + 'T00:00:00');
  let cursor = new Date(currentMonday);
  cursor.setDate(cursor.getDate() - 7);
  const earliest = created ? new Date(created.getFullYear(), created.getMonth(), created.getDate()) : null;
  let guard = 0;
  while(guard++ < 260){ // tope de seguridad: 5 años
    if(earliest && cursor < earliest) break;
    if(!earliest && guard > 12) break; // sin fecha de alta, no te remontes al infinito
    const mondayStr = cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0')+'-'+String(cursor.getDate()).padStart(2,'0');
    weeks.push(mondayStr);
    cursor.setDate(cursor.getDate() - 7);
  }
  return weeks;
}
async function fetchDayConsumed(date){
  if(date === todayStr()) return state.log.foods.reduce((s,f)=>s+f.cal,0);
  const summary = (state.daySummaries || []).find(d => d.date === date);
  if(summary) return summary.consumed;
  const log = await safeGet('log:' + date);
  return log ? log.foods.reduce((s,f)=>s+f.cal,0) : 0;
}
async function fetchWeekConsumption(weekDates){
  const bars = [];
  for(const date of weekDates){
    bars.push({ date, consumed: await fetchDayConsumed(date), isFuture: date > todayStr() });
  }
  return bars;
}

function buildCalorieBarChart(){
  const t = calcTargets(state.profile);

  const weekDates = getCurrentWeekDates();
  const bars = weekDates.map(date => ({
    date,
    consumed: date === todayStr() ? todayConsumed : (summaryMap[date] || 0),
    isFuture: date > todayStr()
  }));
  return barChartSvg(bars, t.calorieTarget);
}

function barChartSvg(bars, target){
  const w = 340, h = 140, pad = 20, gap = 8;
  const n = bars.length; // siempre 7 — el ancho de cada barra no cambia según pasan los días
  const barW = (w - pad*2 - gap*(n-1)) / n;
  const maxVal = Math.max(target, ...bars.map(b=>b.consumed), 1) * 1.15;
  const scaleY = v => (h - pad*2) * Math.min(1, v / maxVal);
  const targetY = h - pad - scaleY(target);
  const barsHtml = bars.map((b,i)=>{
    const x = pad + i*(barW+gap);
    const barH = b.isFuture ? 0 : Math.max(scaleY(b.consumed), b.consumed > 0 ? 2 : 0);
    const y = h - pad - barH;
    const over = b.consumed > target;
    const dt = new Date(b.date + 'T00:00:00');
    const label = dt.toLocaleDateString('es-ES', { weekday:'short' }).charAt(0).toUpperCase();
    const isToday = b.date === todayStr();
    return `<rect class="bar-grow" data-final-y="${y}" data-final-height="${barH}"
              x="${x}" y="${h-pad}" width="${barW}" height="0" rx="4"
              fill="${over ? 'var(--warn)' : 'var(--accent)'}"
              style="transition-delay:${i*60}ms; cursor:${b.isFuture ? 'default' : 'pointer'};"
              ${b.isFuture ? '' : `onclick="openDayDetail('${b.date}')"`}></rect>
            <text x="${x+barW/2}" y="${h-4}" font-size="9" font-weight="${isToday?'700':'400'}" fill="${isToday?'var(--accent)':'var(--muted)'}" text-anchor="middle">${label}</text>`;
  }).join('');
  const svgId = 'barchart-' + Math.random().toString(36).slice(2,8);
  setTimeout(() => animateBarChart(svgId), 30);
  return `<svg id="${svgId}" class="spark" viewBox="0 0 ${w} ${h}">
    <line x1="${pad}" y1="${targetY}" x2="${w-pad}" y2="${targetY}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 3"></line>
    ${barsHtml}
  </svg>`;
}

function animateBarChart(svgId){
  const svg = document.getElementById(svgId);
  if(!svg) return;
  svg.querySelectorAll('.bar-grow').forEach(rect => {
    const finalY = rect.getAttribute('data-final-y');
    const finalH = rect.getAttribute('data-final-height');
    requestAnimationFrame(() => {
      rect.setAttribute('y', finalY);
      rect.setAttribute('height', finalH);
    });
  });
}

function computeStreak(){
  let streak = 0;
  const d = new Date();
  while(true){
    const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const hasLog = ds === todayStr()
      ? (state.log.foods.length > 0 || state.log.exercises.length > 0)
      : (state.logDates || []).includes(ds);
    if(hasLog){ streak++; d.setDate(d.getDate() - 1); } else break;
  }
  return streak;
}

function computeWeeklyAvg(){
  const todayConsumed = state.log.foods.reduce((s,f)=>s+f.cal,0);
  const pastDays = [...state.daySummaries].sort((a,b)=>a.date.localeCompare(b.date)).slice(-6);
  const all = [...pastDays.map(d=>d.consumed), todayConsumed].filter(v => v > 0);
  if(!all.length) return 0;
  return Math.round(all.reduce((a,b)=>a+b, 0) / all.length);
}

let restoreGoogleEmail = null;

function renderGoogleButtonRestore(){
  whenGoogleReady(() => {
    google.accounts.id.initialize({ client_id: DEFAULT_GOOGLE_CLIENT_ID, callback: handleGoogleCredentialRestore });
    const container = document.getElementById('google-signin-btn-restore');
    if(container){
      container.innerHTML = '';
      google.accounts.id.renderButton(container, { theme:'outline', size:'large', width:280, text:'continue_with', locale:'es' });
    }
  });
}

function handleGoogleCredentialRestore(response){
  try{
    const payload = decodeJwt(response.credential);
    restoreGoogleEmail = payload.email || null;
    showToast(restoreGoogleEmail ? `Sesión iniciada como ${restoreGoogleEmail}` : 'No se pudo leer tu email de Google', !restoreGoogleEmail);
  }catch(e){
    console.error('google credential (restore) decode failed', e);
    showToast('No se pudo iniciar sesión con Google', true);
  }
}

async function restoreLicense(){
  const code = document.getElementById('restore-license-input').value;
  if(!restoreGoogleEmail){ showToast('Primero inicia sesión con Google', true); return; }
  if(!code || !code.trim()){ showToast('Pega tu código de licencia', true); return; }
  const valid = await verifyLicenseCode(code, restoreGoogleEmail);
  if(!valid){ showToast('Ese código no coincide con esta cuenta de Google', true); return; }
  state.profile.isPro = true;
  state.profile.email = restoreGoogleEmail;
  state.profile.licenseCode = code.trim();
  await safeSet('profile', state.profile);
  showToast('¡Pro recuperado! 🎉');
  renderAll();
}

function formatDateLabel(d){
  const dt = new Date(d + 'T00:00:00');
  const label = dt.toLocaleDateString('es-ES', { weekday:'short', day:'numeric', month:'short' });
  return d === todayStr() ? 'Hoy' : label;
}

function renderHistoryList(){
  const dates = [...(state.logDates||[])].sort().reverse();

    <div class="row" style="cursor:pointer;" onclick="openDayDetail('${d}')">
